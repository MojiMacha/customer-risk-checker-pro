    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            font-family: 'Kanit', sans-serif;
        }


        .login-card {
            animation: loginIn 0.45s ease;
        }


        @keyframes loginIn {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .logo-animation {
            animation: logoFloat 3s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }

        }


        .toast-animation {
            animation: toastIn 0.25s ease;
        }


        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translate(-50%, 15px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }

        }


        .loading-spinner {
            animation: spin 0.8s linear infinite;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

<!-- =====================================================

<script src="js/auth.js"></script>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

    /* =====================================================
       ELEMENTS
    ====================================================== */

    const loginForm =
        document.getElementById("login-form");

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const loginButton =
        document.getElementById("login-button");

    const loginButtonContent =
        document.getElementById(
            "login-button-content"
        );

    const errorBox =
        document.getElementById("login-error");

    const errorMessage =
        document.getElementById(
            "login-error-message"
        );

    const successBox =
        document.getElementById(
            "login-success"
        );

    const successMessage =
        document.getElementById(
            "login-success-message"
        );

    const togglePassword =
        document.getElementById(
            "toggle-password"
        );

    const passwordIcon =
        document.getElementById(
            "password-icon"
        );



    /* =====================================================
       SHOW ERROR
    ====================================================== */

    function showLoginError(message) {

        successBox.classList.add("hidden");

        errorMessage.textContent = message;

        errorBox.classList.remove("hidden");

    }



    /* =====================================================
       SHOW SUCCESS
    ====================================================== */

    function showLoginSuccess(message) {

        errorBox.classList.add("hidden");

        successMessage.textContent = message;

        successBox.classList.remove("hidden");

    }



    /* =====================================================
       HIDE MESSAGES
    ====================================================== */

    function hideMessages() {

        errorBox.classList.add("hidden");

        successBox.classList.add("hidden");

    }



    /* =====================================================
       TOGGLE PASSWORD
    ====================================================== */

    togglePassword.addEventListener(
        "click",
        function() {

            const isPassword =
                passwordInput.type === "password";


            if (isPassword) {

                passwordInput.type = "text";

                passwordIcon.className =
                    "fa-solid fa-eye-slash";

                togglePassword.setAttribute(
                    "aria-label",
                    "ซ่อนรหัสผ่าน"
                );

            }

            else {

                passwordInput.type = "password";

                passwordIcon.className =
                    "fa-solid fa-eye";

                togglePassword.setAttribute(
                    "aria-label",
                    "แสดงรหัสผ่าน"
                );

            }

        }
    );



    /* =====================================================
       DEMO ACCOUNT
    ====================================================== */

    function fillDemoAccount(type) {

        hideMessages();


        if (type === "customer") {

            usernameInput.value =
                "customer";

            passwordInput.value =
                "1234";

        }


        else if (type === "staff") {

            usernameInput.value =
                "staff";

            passwordInput.value =
                "1234";

        }


        usernameInput.focus();

    }



    /* =====================================================
       LOADING STATE
    ====================================================== */

    function setLoading(isLoading) {

        loginButton.disabled =
            isLoading;


        if (isLoading) {

            loginButton.classList.add(
                "opacity-70",
                "cursor-not-allowed"
            );


            loginButtonContent.innerHTML = `

                <i
                    class="
                        fa-solid
                        fa-spinner
                        loading-spinner
                        mr-2
                    "
                ></i>

                กำลังเข้าสู่ระบบ...

            `;

        }

        else {

            loginButton.classList.remove(
                "opacity-70",
                "cursor-not-allowed"
            );


            loginButtonContent.innerHTML = `

                <i
                    class="
                        fa-solid
                        fa-right-to-bracket
                        mr-2
                    "
                ></i>

                เข้าสู่ระบบ

            `;

        }

    }



    /* =====================================================
       LOGIN
    ====================================================== */

    loginForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            hideMessages();


            const username =
                usernameInput.value.trim();


            const password =
                passwordInput.value;


            if (!username) {

                showLoginError(
                    "กรุณากรอกชื่อผู้ใช้"
                );

                usernameInput.focus();

                return;

            }


            if (!password) {

                showLoginError(
                    "กรุณากรอกรหัสผ่าน"
                );

                passwordInput.focus();

                return;

            }


            setLoading(true);


            /*
               เรียก login() จาก auth.js
            */

            const result =
                login(
                    username,
                    password
                );


            if (!result.success) {

                setLoading(false);

                showLoginError(
                    result.message
                );

                passwordInput.focus();

                return;

            }


            /* =============================================
               LOGIN SUCCESS
            ============================================== */

            const user =
                result.user;


            showLoginSuccess(

                "เข้าสู่ระบบสำเร็จ — " +

                (
                    user.role === "staff"

                        ? "กำลังเข้าสู่ระบบพนักงาน"

                        : "กำลังเข้าสู่ Marketplace"
                )

            );


            /*
               รอเล็กน้อยให้ผู้ใช้เห็นข้อความ
            */

            setTimeout(

                function() {

                    if (
                        user.role === "staff"
                    ) {

                        /*
                           Staff → Admin
                        */

                        const redirect =
                            getLoginRedirect();


                        /*
                           ถ้า redirect เป็น
                           checkout.html
                           ห้าม Staff เข้า
                        */

                        if (
                            redirect ===
                            "checkout.html"
                        ) {

                            window.location.href =
                                "admin.html";

                            return;

                        }


                        window.location.href =
                            redirect ||
                            "admin.html";

                    }

                    else {

                        /*
                           Customer → Shop
                        */

                        const redirect =
                            getLoginRedirect();


                        /*
                           ถ้า redirect เป็น
                           admin.html
                           ห้าม Customer เข้า
                        */

                        if (
                            redirect ===
                            "admin.html"
                        ) {

                            window.location.href =
                                "shop.html";

                            return;

                        }


                        window.location.href =
                            redirect ||
                            "shop.html";

                    }

                },

                500

            );

        }
    );



    /* =====================================================
       ALREADY LOGGED IN
    ====================================================== */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            const currentUser =
                getCurrentUser();


            if (!currentUser) {

                return;

            }


            /*
               ถ้า Login อยู่แล้ว
               ไม่จำเป็นต้อง Login ซ้ำ
            */

            if (
                currentUser.role === "staff"
            ) {

                /*
                   Staff → Admin
                */

                window.location.href =
                    "admin.html";

            }

            else {

                /*
                   Customer → Shop
                */

                window.location.href =
                    "shop.html";

            }

        }
    );

</script>
