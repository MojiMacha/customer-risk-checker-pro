<script>

function playSuccess() {

    const audio = new Audio('./sounds/meng.mp3');

    audio.volume = 1.0;

    audio.play()
        .then(() => {

            document.getElementById('status').innerText =
                '🔊 กำลังเล่นเสียง ส่งสำเร็จ (meng.mp3)';

            console.log('SUCCESS SOUND OK');

        })
        .catch(error => {

            document.getElementById('status').innerText =
                '❌ เล่น sounds/meng.mp3 ไม่ได้';

            console.error('SUCCESS SOUND ERROR:', error);

        });

}


function playFailed() {

    const audio = new Audio('./sounds/failed.mp3');

    audio.volume = 1.0;

    audio.play()
        .then(() => {

            document.getElementById('status').innerText =
                '🔊 กำลังเล่นเสียง ตีกลับ (failed.mp3)';

            console.log('FAILED SOUND OK');

        })
        .catch(error => {

            document.getElementById('status').innerText =
                '❌ เล่น sounds/failed.mp3 ไม่ได้';

            console.error('FAILED SOUND ERROR:', error);

        });

}

</script>
