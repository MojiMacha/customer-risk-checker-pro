<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแอดมิน - Delivery Risk Pro</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- 🔒 หน้าต่างบังคับกรอก PIN แอดมิน -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-5 border border-slate-100">
            <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">เข้าสู่ระบบแอดมิน</h2>
                <p class="text-xs text-slate-500 mt-1">กรุณากรอกรหัส PIN สำหรับแอดมิน</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="pin-input" maxlength="6" placeholder="• • • • • •" 
                    class="w-full text-center text-2xl tracking-[0.4em] font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-amber-500 focus:outline-none bg-slate-50">
                
                <!-- 🚨 ข้อความเตือน PIN ไม่ถูกต้อง -->
                <p id="pin-error" class="text-xs text-rose-500 font-bold hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> รหัส PIN ไม่ถูกต้อง!
                </p>

                <button onclick="loginAdmin()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-amber-200 transition-all active:scale-95">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>
    </div>

    <!-- 👑 เนื้อหาหลักระบบแอดมิน -->
    <div id="main-content" class="hidden">
        <nav class="bg-amber-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-base md:text-lg">👑 ผู้ดูแลระบบ (Admin)</span>
                </div>
                <div class="flex items-center space-x-3 text-xs md:text-sm font-medium">
                    <a href="driver.html" class="text-amber-200 hover:text-white px-2 py-1">พนักงานส่ง</a>
                    <a href="admin.html" class="text-white bg-amber-800/90 px-3 py-1 rounded-lg border border-amber-700/50 font-bold">แอดมิน</a>
                    <a href="blacklist.html" class="text-amber-200 hover:text-white px-2 py-1">แบล็กลิสต์</a>
                    <a href="tracking.html" class="text-amber-200 hover:text-white px-2 py-1">ลูกค้า</a>
                    <button onclick="logoutAdmin()" class="text-rose-300 hover:text-rose-100 bg-rose-950/40 px-2.5 py-1 rounded-lg border border-rose-800/50">ออกจากระบบ</button>
                </div>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800">จัดการข้อมูลประวัติการจัดส่ง</h2>
                <div id="admin-user-list" class="space-y-3">
                    <!-- รายชื่อผู้รับจะแสดงตรงนี้ผ่าน JavaScript -->
                </div>
            </div>
        </main>
    </div>

    <!-- 🔗 เรียกใช้งานไฟล์ JS ครบถ้วนตามลำดับ -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sound.js"></script>

    <script>
        // 🔓 ปลดล็อกระบบเสียงของเบราว์เซอร์เมื่อมีการแตะหรือคลิกหน้าเว็บ
        function unlockAudio() {
            if (typeof SoundSystem !== 'undefined' && SoundSystem.initAudioContext) {
                SoundSystem.initAudioContext();
            }
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_role') === 'ADMIN' || sessionStorage.getItem('admin_logged_in') === 'true') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                renderUserList();
            }
        });

        // 🔊 สั่งเล่นเสียงแบบปลอดภัย
        function safePlaySound(type) {
            if (typeof playSound === 'function') {
                playSound(type);
            } else if (typeof SoundSystem !== 'undefined' && SoundSystem.play) {
                SoundSystem.play(type);
            }
        }

        function loginAdmin() {
            unlockAudio(); // ปลดล็อกเสียงทันทีที่กดปุ่มเข้าสู่ระบบ
            const inputPin = document.getElementById('pin-input').value.trim();
            const correctPin = (typeof CONFIG !== 'undefined' && CONFIG.ADMIN_PIN) ? CONFIG.ADMIN_PIN : '888888';
            const pinError = document.getElementById('pin-error');

            if (inputPin === correctPin) {
                sessionStorage.setItem('staff_role', 'ADMIN');
                sessionStorage.setItem('admin_logged_in', 'true');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                if (pinError) pinError.classList.add('hidden');
                renderUserList();
            } else {
                // 🔊 เล่นเสียงเตือนรหัสผิด
                safePlaySound('wrong_pin');

                // ⚠️ แสดงตัวหนังสือสีแดงแจ้งเตือน
                if (pinError) pinError.classList.remove('hidden');
                document.getElementById('pin-input').value = '';
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('staff_role');
            sessionStorage.removeItem('admin_logged_in');
            location.reload();
        }

        function renderUserList() {
            const listContainer = document.getElementById('admin-user-list');
            if (!listContainer || typeof DB === 'undefined') return;

            const users = DB.getAll();
            if (users.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-400 text-center py-4">ยังไม่มีข้อมูลในระบบ</p>`;
                return;
            }

            listContainer.innerHTML = users.map(user => `
                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <div>
                        <p class="font-bold text-slate-800">${user.name}</p>
                        <p class="text-xs text-slate-500">สำเร็จ: ${user.success} | ตีกลับ: ${user.failed}</p>
                    </div>
                    <span class="text-xs px-3 py-1 rounded-full font-bold ${user.isBlacklisted ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                        ${user.isBlacklisted ? 'Blacklisted' : 'Normal'}
                    </span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
