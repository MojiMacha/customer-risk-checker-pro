<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแอดมินและวิเคราะห์ยอด - Delivery Risk Pro</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Libraries สำหรับวาดกราฟ (Chart.js & ApexCharts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 🔒 หน้าต่างบังคับกรอก PIN -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-5 border border-slate-100">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">เข้าสู่ระบบแอดมิน</h2>
                <p class="text-xs text-slate-500 mt-1">กรุณากรอกรหัส PIN 6 หลักเพื่อเข้าใช้งาน</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="pin-input" maxlength="6" placeholder="• • • • • •" 
                    class="w-full text-center text-2xl tracking-[0.4em] font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:outline-none bg-slate-50">
                <p id="pin-error" class="text-xs text-rose-500 font-bold hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> รหัส PIN ไม่ถูกต้อง
                </p>
                <button onclick="loginStaff()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>
    </div>

    <!-- ⚙️ เนื้อหาหลักแอดมิน -->
    <div id="main-content" class="hidden">
        <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <button onclick="history.back()" class="flex items-center gap-1.5 text-xs bg-indigo-800/80 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-700/60 transition-all active:scale-95">
                        <i class="fa-solid fa-arrow-left"></i> <span>ย้อนกลับ</span>
                    </button>
                    <span class="font-bold text-base md:text-lg">⚙️ ระบบจัดการข้อมูลแอดมิน</span>
                </div>
                <div class="flex items-center space-x-3 text-xs md:text-sm font-medium">
                    <a href="driver.html" class="text-indigo-200 hover:text-white px-2 py-1">พนักงานส่ง</a>
                    <a href="admin.html" class="text-white bg-indigo-800/90 px-3 py-1 rounded-lg border border-indigo-700/50 font-bold">แอดมิน</a>
                    <a href="blacklist.html" class="text-indigo-200 hover:text-white px-2 py-1">แบล็กลิสต์</a>
                    <a href="tracking.html" class="text-indigo-200 hover:text-white px-2 py-1">ลูกค้า</a>
                    <button onclick="logoutStaff()" class="text-rose-300 hover:text-rose-100 bg-rose-950/40 px-2.5 py-1 rounded-lg border border-rose-800/50">ออกจากระบบ</button>
                </div>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto px-4 pt-6 space-y-6">

            <!-- 📊 ส่วนแสดงกราฟวิเคราะห์ข้อมูลยอดขายและสัดส่วน -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- กราฟแบบวงกลม (Pie Chart) -->
                <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600"></i> สัดส่วนการจัดส่งทั้งหมด
                    </h3>
                    <div class="relative h-64 flex items-center justify-center">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>

                <!-- กราฟแท่งเทียน (Candlestick Chart) แสดงความผันผวนยอดจัดส่ง -->
                <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3 md:col-span-2">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-chart-line text-emerald-600"></i> แนวโน้มยอดจัดส่ง & ความผันผวน (Candlestick)
                        </h3>
                        <span class="text-[10px] bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full font-medium">ย้อนหลัง 5 วัน</span>
                    </div>
                    <div id="candlestickChart" class="h-64"></div>
                </div>
            </div>

            <!-- 📥 ส่วนปุ่มดาวน์โหลด/Export ข้อมูลลูกค้า -->
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between gap-3 items-center">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="text" id="admin-search" oninput="renderTable()" placeholder="ค้นหาชื่อผู้รับ..." class="p-2.5 border rounded-xl text-sm w-full sm:w-64 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-end">
                    <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-file-excel"></i> ดาวน์โหลดไฟล์ Excel (CSV)
                    </button>
                    <button onclick="copyJSON()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-1.5 active:scale-95">
                        <i class="fa-solid fa-code"></i> คัดลอกข้อมูล JSON
                    </button>
                    <button onclick="resetDataPrompt()" class="bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-xs font-bold px-3 py-2.5 rounded-xl border border-slate-200 transition-all flex items-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> รีเซ็ต
                    </button>
                </div>
            </div>

            <!-- 📋 ตารางแสดงรายชื่อลูกค้า -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase font-bold">
                        <tr>
                            <th class="p-4">ชื่อผู้รับ</th>
                            <th class="p-4 text-center">สำเร็จ</th>
                            <th class="p-4 text-center">ตีกลับ</th>
                            <th class="p-4 text-center">รวม</th>
                            <th class="p-4 text-center">ระดับความเสี่ยง</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script>
        let doughnutChartInstance = null;
        let candleChartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_logged_in') === 'true') {
                showAdmin();
            }
        });

        document.getElementById('pin-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginStaff();
        });

        function loginStaff() {
            const inputPin = document.getElementById('pin-input').value.trim();
            if (inputPin === CONFIG.STAFF_PIN) {
                sessionStorage.setItem('staff_logged_in', 'true');
                showAdmin();
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
                document.getElementById('pin-input').value = '';
            }
        }

        function logoutStaff() {
            sessionStorage.removeItem('staff_logged_in');
            location.reload();
        }

        function showAdmin() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            renderTable();
            renderCharts();
        }

        function renderTable() {
            const users = DB.getAll();
            const search = document.getElementById('admin-search').value.toLowerCase().trim();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.filter(u => u.name.toLowerCase().includes(search)).forEach(user => {
                const risk = DB.calculateRisk(user);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-4 font-semibold text-slate-800">
                        ${user.name}
                        ${user.isBlacklisted ? `<br><span class="text-[10px] text-rose-500 font-bold">🚫 ${user.blacklistReason || 'ติดแบล็กลิสต์'}</span>` : ''}
                    </td>
                    <td class="p-4 text-center font-bold text-emerald-600">${user.success}</td>
                    <td class="p-4 text-center font-bold text-rose-600">${user.failed}</td>
                    <td class="p-4 text-center font-bold text-slate-700">${user.total}</td>
                    <td class="p-4 text-center"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${risk.colorClass}">${risk.label}</span></td>
                    <td class="p-4 text-center">
                        <button onclick="toggleBlacklist('${user.name}')" class="text-xs px-2.5 py-1 rounded-lg border font-bold ${user.isBlacklisted ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-rose-50 text-rose-600 border-rose-200'}">
                            ${user.isBlacklisted ? 'ปลดแบล็กลิสต์' : 'ติดแบล็กลิสต์'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- 📊 วาดกราฟ Doughnut & Candlestick ---
        function renderCharts() {
            const users = DB.getAll();
            let totalSuccess = 0, totalFailed = 0;

            users.forEach(u => {
                totalSuccess += u.success;
                totalFailed += u.failed;
            });

            // 1. วาด Doughnut Chart (วงกลม)
            const ctx = document.getElementById('doughnutChart').getContext('2d');
            if (doughnutChartInstance) doughnutChartInstance.destroy();

            doughnutChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ส่งสำเร็จ', 'ตีกลับ/ล้มเหลว'],
                    datasets: [{
                        data: [totalSuccess, totalFailed],
                        backgroundColor: ['#10b981', '#f43f5e'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            // 2. วาด Candlestick Chart (แท่งเทียน)
            const options = {
                series: [{
                    data: [
                        { x: 'วันจันทร์', y: [10, 25, 8, 22] },
                        { x: 'วันอังคาร', y: [22, 35, 18, 30] },
                        { x: 'วันพุธ', y: [30, 32, 20, 25] },
                        { x: 'วันพฤหัสบดี', y: [25, 42, 24, 40] },
                        { x: 'วันศุกร์', y: [40, 50, 35, 48] }
                    ]
                }],
                chart: { type: 'candlestick', height: 230, toolbar: { show: false } },
                xaxis: { type: 'category' },
                yaxis: { tooltip: { enabled: true } }
            };

            if (candleChartInstance) candleChartInstance.destroy();
            candleChartInstance = new ApexCharts(document.querySelector("#candlestickChart"), options);
            candleChartInstance.render();
        }

        // --- 📥 ระบบ Export ข้อมูลไปใช้ที่อื่น ---
        
        // 1. ดาวน์โหลดเป็นไฟล์ CSV (เปิดใน Excel ได้ทันที ภาษาไทยไม่ต่าง)
        function exportToCSV() {
            const users = DB.getAll();
            if (users.length === 0) return alert('ไม่มีข้อมูลสำหรับส่งออก');

            // BOM (\uFEFF) ช่วยให้ Excel อ่านภาษาไทยได้ถูกต้อง
            let csvContent = "\uFEFFลำดับ,ชื่อผู้รับ,ส่งสำเร็จ,ตีกลับ,รวมทั้งหมด,สถานะความเสี่ยง,ติดแบล็กลิสต์,เหตุผล\n";

            users.forEach((u, index) => {
                const risk = DB.calculateRisk(u);
                csvContent += `${index + 1},"${u.name}",${u.success},${u.failed},${u.total},"${risk.label}",${u.isBlacklisted ? 'ใช่' : 'ไม่'},"${u.blacklistReason || ''}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `customer_data_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 2. คัดลอกข้อมูลรูปแบบ JSON
        function copyJSON() {
            const users = DB.getAll();
            navigator.clipboard.writeText(JSON.stringify(users, null, 2)).then(() => {
                alert('คัดลอกข้อมูลลูกค้า (JSON) ลง Clipboard แล้ว! สามารถนำไปวางใช้งานที่อื่นได้ทันที');
            });
        }

        function toggleBlacklist(userName) {
            const list = DB.getAll();
            const user = list.find(u => u.name === userName);
            if (!user) return;
            if (!user.isBlacklisted) {
                const reason = prompt(`ระบุเหตุผลติดแบล็กลิสต์ของคุณ ${user.name}:`, 'ปฏิเสธการชำระเงิน COD');
                if (reason === null) return;
                user.isBlacklisted = true;
                user.blacklistReason = reason;
            } else {
                user.isBlacklisted = false;
                user.blacklistReason = '';
            }
            DB.save(list);
            renderTable();
            renderCharts();
        }

        function resetDataPrompt() {
            if (confirm('คุณต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็น 43 รายชื่อเริ่มต้นหรือไม่?')) {
                DB.resetToDefault();
                renderTable();
                renderCharts();
            }
        }
    </script>
</body>
</html>
