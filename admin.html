<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Delivery Risk Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <header class="bg-indigo-900 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-chart-line text-amber-400 mr-2"></i>Executive Dashboard</h1>
            <nav class="space-x-3 text-sm">
                <a href="driver.html" class="text-indigo-200 hover:text-white">พนักงานส่ง</a>
                <a href="admin.html" class="font-bold border-b-2 border-amber-400 pb-1">แอดมิน</a>
                <a href="blacklist.html" class="text-indigo-200 hover:text-white">แบล็กลิสต์</a>
                <a href="tracking.html" class="text-indigo-200 hover:text-white">ลูกค้า</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs text-slate-500 font-bold block mb-1">ผู้รับทั้งหมดในระบบ</span>
                <p id="stat-total-users" class="text-3xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs text-slate-500 font-bold block mb-1">ยอดพัสดุรวม</span>
                <p id="stat-total-orders" class="text-3xl font-black text-indigo-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs text-rose-500 font-bold block mb-1">กลุ่มความเสี่ยงสูง</span>
                <p id="stat-high-risk" class="text-3xl font-black text-rose-600">0</p>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs text-purple-500 font-bold block mb-1">ติดแบล็กลิสต์</span>
                <p id="stat-blacklisted" class="text-3xl font-black text-purple-700">0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-slate-800 mb-4"><i class="fa-solid fa-chart-pie mr-2 text-indigo-500"></i>สัดส่วนระดับความเสี่ยง</h2>
                <div class="h-60 flex justify-center">
                    <canvas id="riskPieChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="font-bold text-slate-800 mb-4"><i class="fa-solid fa-chart-bar mr-2 text-indigo-500"></i>ส่งสำเร็จ vs ตีกลับ รวม</h2>
                <div class="h-60 flex justify-center">
                    <canvas id="deliveryBarChart"></canvas>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-users mr-2 text-indigo-500"></i>รายชื่อผู้รับทั้งหมด</h2>
                <input type="text" id="table-search" oninput="renderTable()" placeholder="ค้นหาชื่อ..." class="border px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b text-xs text-slate-500 font-bold">
                            <th class="p-3">ชื่อผู้รับ</th>
                            <th class="p-3">จัดส่งทั้งหมด</th>
                            <th class="p-3">สำเร็จ</th>
                            <th class="p-3">ตีกลับ</th>
                            <th class="p-3">อัตราการตีกลับ</th>
                            <th class="p-3">สถานะ</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadDashboard);

        function loadDashboard() {
            const users = DB.getAll();
            let totalOrders = 0, highRiskCount = 0, blacklistedCount = 0;
            let totalSuccess = 0, totalFailed = 0;
            let riskCounts = { LOW: 0, MEDIUM: 0, HIGH: 0 };

            users.forEach(u => {
                const risk = DB.calculateRisk(u);
                totalOrders += risk.total;
                totalSuccess += u.success;
                totalFailed += u.failed;

                riskCounts[risk.level]++;
                if (risk.level === 'HIGH') highRiskCount++;
                if (u.isBlacklisted) blacklistedCount++;
            });

            document.getElementById('stat-total-users').innerText = users.length;
            document.getElementById('stat-total-orders').innerText = totalOrders;
            document.getElementById('stat-high-risk').innerText = highRiskCount;
            document.getElementById('stat-blacklisted').innerText = blacklistedCount;

            renderCharts(riskCounts, totalSuccess, totalFailed);
            renderTable();
        }

        function renderCharts(riskCounts, success, failed) {
            new Chart(document.getElementById('riskPieChart'), {
                type: 'doughnut',
                data: {
                    labels: ['เสี่ยงต่ำ', 'เสี่ยงปานกลาง', 'เสี่ยงสูง'],
                    datasets: [{
                        data: [riskCounts.LOW, riskCounts.MEDIUM, riskCounts.HIGH],
                        backgroundColor: ['#10b981', '#f59e0b', '#f43f5e']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            new Chart(document.getElementById('deliveryBarChart'), {
                type: 'bar',
                data: {
                    labels: ['ส่งสำเร็จ', 'ตีกลับ / ล้มเหลว'],
                    datasets: [{
                        label: 'จำนวนพัสดุ',
                        data: [success, failed],
                        backgroundColor: ['#10b981', '#f43f5e']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function renderTable() {
            const users = DB.getAll();
            const query = document.getElementById('table-search').value.toLowerCase();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            users.filter(u => u.name.toLowerCase().includes(query)).forEach(u => {
                const risk = DB.calculateRisk(u);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-slate-800">
                        ${u.name} ${u.isBlacklisted ? '<span class="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full ml-1">Blacklist</span>' : ''}
                    </td>
                    <td class="p-3">${risk.total}</td>
                    <td class="p-3 text-emerald-600 font-semibold">${u.success}</td>
                    <td class="p-3 text-rose-600 font-semibold">${u.failed}</td>
                    <td class="p-3 font-bold">${risk.scorePercent}%</td>
                    <td class="p-3"><span class="px-3 py-1 rounded-full text-xs font-bold ${risk.colorClass}">${risk.label}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
