<script>

let orders = [];
let latestOrder = null;
let currentOrder = null;


function loadOrders() {

    try {

        const savedOrders = localStorage.getItem("orders");

        if (savedOrders) {
            orders = JSON.parse(savedOrders);
        } else {
            orders = [];
        }

    } catch (error) {

        console.error("ไม่สามารถโหลด orders ได้", error);

        orders = [];

    }


    try {

        const savedLatest =
            localStorage.getItem("latestOrder");

        if (savedLatest) {
            latestOrder = JSON.parse(savedLatest);
        } else {
            latestOrder = null;
        }

    } catch (error) {

        console.error(
            "ไม่สามารถโหลด latestOrder ได้",
            error
        );

        latestOrder = null;

    }

}


function normalizeOrderId(value) {

    return String(value || "")
        .trim()
        .toUpperCase();

}


function handleSearchKey(event) {

    if (event.key === "Enter") {
        searchOrder();
    }

}


function searchOrder() {

    const input =
        document.getElementById("order-id-input");

    const orderId =
        normalizeOrderId(input.value);


    hideMessage();


    if (!orderId) {

        showMessage(
            "กรุณากรอกเลขออเดอร์",
            "error"
        );

        input.focus();

        return;

    }


    const order =
        orders.find(
            item =>
                normalizeOrderId(item.id) === orderId
        );


    if (!order) {

        showMessage(
            "ไม่พบคำสั่งซื้อเลขนี้ กรุณาตรวจสอบเลขออเดอร์อีกครั้ง",
            "error"
        );

        document
            .getElementById("tracking-result")
            .classList.add("hidden");

        return;

    }


    currentOrder = order;

    renderTracking(order);

}


function showLatestOrder() {

    hideMessage();

    hideOrdersList();


    if (!latestOrder) {

        showMessage(
            "ยังไม่มีออเดอร์ล่าสุด",
            "error"
        );

        return;

    }


    const input =
        document.getElementById("order-id-input");

    input.value = latestOrder.id || "";


    currentOrder = latestOrder;

    renderTracking(latestOrder);

}


function showAllOrders() {

    hideMessage();

    hideTrackingResult();


    if (!orders || orders.length === 0) {

        showMessage(
            "ยังไม่มีประวัติคำสั่งซื้อ",
            "error"
        );

        return;

    }


    renderOrdersList();

}

function selectOrderFromList(orderId) {

    const order =
        orders.find(
            item =>
                normalizeOrderId(item.id) ===
                normalizeOrderId(orderId)
        );


    if (!order) {
        return;
    }


    document.getElementById("order-id-input").value =
        order.id;


    currentOrder = order;

    hideOrdersList();

    renderTracking(order);

}

function renderTimeline(currentStatus) {

    const steps = [

        {
            key: "รับคำสั่งซื้อ",
            title: "รับคำสั่งซื้อ",
            description: "ระบบได้รับคำสั่งซื้อของคุณแล้ว",
            icon: "fa-solid fa-clipboard-check"
        },

        {
            key: "กำลังเตรียมสินค้า",
            title: "กำลังเตรียมสินค้า",
            description: "ร้านค้ากำลังจัดเตรียมสินค้าสำหรับจัดส่ง",
            icon: "fa-solid fa-box-open"
        },

        {
            key: "กำลังจัดส่ง",
            title: "กำลังจัดส่ง",
            description: "พัสดุถูกส่งออกจากร้านค้าแล้ว",
            icon: "fa-solid fa-truck-fast"
        },

        {
            key: "จัดส่งสำเร็จ",
            title: "จัดส่งสำเร็จ",
            description: "คุณได้รับสินค้าเรียบร้อยแล้ว",
            icon: "fa-solid fa-circle-check"
        }

    ];


    let currentIndex =
        getStatusIndex(currentStatus);


    return steps.map((step, index) => {

        const completed =
            index <= currentIndex;

        const active =
            index === currentIndex;


        return `

            <div
                class="timeline-item
                relative
                flex
                gap-4
                pb-6"
            >

                <div
                    class="timeline-line"
                    style="
                        ${
                            completed && index < steps.length - 1
                                ? "background:#4f46e5;"
                                : ""
                        }
                    "
                ></div>


                <div
                    class="timeline-dot
                    w-10 h-10
                    rounded-full
                    flex
                    items-center
                    justify-center
                    shrink-0
                    ${
                        completed
                            ? "bg-indigo-600 text-white"
                            : "bg-slate-100 text-slate-300"
                    }
                    ${
                        active
                            ? "status-pulse"
                            : ""
                    }"
                >

                    <i class="${step.icon} text-sm"></i>

                </div>


                <div class="pt-1">

                    <p
                        class="text-sm
                        font-black
                        ${
                            completed
                                ? "text-slate-800"
                                : "text-slate-400"
                        }"
                    >
                        ${step.title}
                    </p>

                    <p
                        class="text-xs
                        ${
                            completed
                                ? "text-slate-500"
                                : "text-slate-300"
                        }
                        mt-1"
                    >
                        ${step.description}
                    </p>

                </div>

            </div>

        `;

    }).join("");

}


function renderOrderItems(items) {

    if (!items || items.length === 0) {

        return `

            <div
                class="text-center
                py-8
                text-slate-400"
            >

                <i
                    class="fa-solid
                    fa-box-open
                    text-3xl
                    text-slate-200"
                ></i>

                <p class="text-xs mt-2">
                    ไม่พบรายการสินค้า
                </p>

            </div>

        `;

    }


    return items.map(item => {

        const price =
            Number(item.price || 0);

        const quantity =
            Number(item.quantity || 1);

        const itemTotal =
            price * quantity;


        return `

            <div
                class="flex
                gap-3
                p-3
                bg-slate-50
                rounded-2xl"
            >

                <img
                    src="${escapeHtml(item.image || "")}"
                    alt="${escapeHtml(item.name || "สินค้า")}"
                    class="w-16 h-16
                    rounded-xl
                    object-cover
                    bg-slate-200"
                    onerror="
                        this.src='https://placehold.co/100x100/e2e8f0/64748b?text=No+Image'
                    "
                >


                <div class="flex-1 min-w-0">

                    <p
                        class="text-sm
                        font-bold
                        line-clamp-2"
                    >
                        ${escapeHtml(item.name || "สินค้า")}
                    </p>


                    <p
                        class="text-xs
                        text-slate-400
                        mt-1"
                    >
                        จำนวน ${quantity} ชิ้น
                    </p>

                </div>


                <div class="text-right">

                    <p
                        class="text-sm
                        font-black
                        text-indigo-600"
                    >
                        ฿${itemTotal.toLocaleString()}
                    </p>

                    <p
                        class="text-[10px]
                        text-slate-400
                        mt-1"
                    >
                        ฿${price.toLocaleString()} / ชิ้น
                    </p>

                </div>

            </div>

        `;

    }).join("");

}


function getStatusIndex(status) {

    const statuses = [
        "รับคำสั่งซื้อ",
        "กำลังเตรียมสินค้า",
        "กำลังจัดส่ง",
        "จัดส่งสำเร็จ"
    ];


    const index =
        statuses.indexOf(status);


    if (index === -1) {

        return 1;

    }


    return index;

}


function getStatusInfo(status) {

    switch (status) {

        case "รับคำสั่งซื้อ":

            return {
                text: "รับคำสั่งซื้อ",
                description: "ระบบได้รับคำสั่งซื้อของคุณแล้ว",
                icon: "fa-solid fa-clipboard-check",
                className: "bg-blue-50 text-blue-600"
            };


        case "กำลังจัดเตรียมสินค้า":
        case "กำลังเตรียมสินค้า":

            return {
                text: "กำลังเตรียมสินค้า",
                description: "ร้านค้ากำลังจัดเตรียมสินค้าของคุณ",
                icon: "fa-solid fa-box-open",
                className: "bg-amber-50 text-amber-600"
            };


        case "กำลังจัดส่ง":

            return {
                text: "กำลังจัดส่ง",
                description: "พัสดุกำลังเดินทางไปยังที่อยู่ของคุณ",
                icon: "fa-solid fa-truck-fast",
                className: "bg-indigo-50 text-indigo-600"
            };


        case "จัดส่งสำเร็จ":

            return {
                text: "จัดส่งสำเร็จ",
                description: "พัสดุถูกจัดส่งถึงคุณเรียบร้อยแล้ว",
                icon: "fa-solid fa-circle-check",
                className: "bg-emerald-50 text-emerald-600"
            };


        default:

            return {
                text: status || "กำลังดำเนินการ",
                description: "คำสั่งซื้อกำลังอยู่ระหว่างดำเนินการ",
                icon: "fa-solid fa-clock",
                className: "bg-slate-100 text-slate-600"
            };

    }

}


function getPaymentName(payment) {

    switch (payment) {

        case "card":
            return "บัตรเครดิต / เดบิต";

        case "qr":
            return "QR พร้อมเพย์";

        case "cod":
            return "เก็บเงินปลายทาง";

        default:
            return "ไม่ระบุ";

    }

}


function getItemCount(order) {

    if (!order || !order.items) {
        return 0;
    }


    return order.items.reduce(
        (sum, item) =>
            sum + Number(item.quantity || 1),
        0
    );

}


function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {
        return "-";
    }


    return date.toLocaleString(
        "th-TH",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


function showMessage(text, type) {

    const container =
        document.getElementById("message");


    container.classList.remove("hidden");


    if (type === "error") {

        container.innerHTML = `

            <div
                class="bg-rose-50
                border border-rose-100
                text-rose-600
                rounded-2xl
                p-4
                text-sm
                flex
                items-center
                gap-3"
            >

                <i
                    class="fa-solid
                    fa-circle-exclamation"
                ></i>

                <span>
                    ${escapeHtml(text)}
                </span>

            </div>

        `;

    }

    else {

        container.innerHTML = `

            <div
                class="bg-emerald-50
                border border-emerald-100
                text-emerald-600
                rounded-2xl
                p-4
                text-sm
                flex
                items-center
                gap-3"
            >

                <i
                    class="fa-solid
                    fa-circle-check"
                ></i>

                <span>
                    ${escapeHtml(text)}
                </span>

            </div>

        `;

    }

}


function hideMessage() {

    document
        .getElementById("message")
        .classList.add("hidden");

}


function hideTrackingResult() {

    document
        .getElementById("tracking-result")
        .classList.add("hidden");

}


function hideOrdersList() {

    document
        .getElementById("orders-list")
        .classList.add("hidden");

}


function printOrder() {

    if (!currentOrder) {

        alert("ยังไม่ได้เลือกคำสั่งซื้อ");

        return;

    }


    window.print();

}


function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeJs(value) {

    return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");

}


document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadOrders();


        if (latestOrder) {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const orderId =
                normalizeOrderId(
                    params.get("order")
                );


            if (orderId) {

                const order =
                    orders.find(
                        item =>
                            normalizeOrderId(item.id) ===
                            orderId
                    );


                if (order) {

                    document
                        .getElementById("order-id-input")
                        .value = order.id;

                    currentOrder = order;

                    renderTracking(order);

                }

            }

        }

    }
);

</script>
