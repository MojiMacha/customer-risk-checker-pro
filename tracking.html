<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามพัสดุ - Delivery Risk Pro</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- ================= Navbar พร้อมปุ่มย้อนกลับ & เมนูเชื่อมโยง ================= -->
    <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- ฝั่งซ้าย: ปุ่มย้อนกลับ + โลโก้ -->
            <div class="flex items-center space-x-3">
                <button onclick="history.back()" class="flex items-center gap-1.5 text-xs bg-indigo-800/80 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-700/60 transition-all active:scale-95 shadow-sm">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>ย้อนกลับ</span>
                </button>

                <div class="flex items-center space-x-2 border-l border-indigo-700/60 pl-3">
                    <div class="w-8 h-8 bg-amber-400 rounded-lg flex items-center justify-center text-indigo-950 font-bold shadow">
                        <i class="fa-solid fa-box text-sm"></i>
                    </div>
                    <span class="font-bold text-base md:text-lg tracking-wide hidden sm:inline">ติดตามสถานะพัสดุ</span>
                </div>
            </div>

            <!-- ฝั่งขวา: เมนูเชื่อมโยงหน้าต่างๆ -->
            <div class="flex items-center space-x-2 sm:space-x-4 text-xs md:text-sm font-medium">
                <a href="driver.html" class="text-indigo-200 hover:text-white px-2 py-1 rounded-md transition-colors">พนักงานส่ง</a>
                <a href="admin.html" class="text-indigo-200 hover:text-white px-2 py-1 rounded-md transition-colors">แอดมิน</a>
                <a href="blacklist.html" class="text-indigo-200 hover:text-white px-2 py-1 rounded-md transition-colors">แบล็กลิสต์</a>
                <a href="tracking.html" class="text-white bg-indigo-800/90 px-3 py-1 rounded-lg border border-indigo-700/50 font-bold shadow-sm">ลูกค้า</a>
            </div>

        </div>
    </nav>

    <!-- ================= ส่วนเนื้อหาหลัก ================= -->
    <main class="max-w-3xl mx-auto px-4 pt-8 space-y-6">

        <!-- กล่องค้นหาพัสดุ / ค้นหาชื่อ -->
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-lg shadow-slate-200/50 border border-slate-100 space-y-5 text-center relative overflow-hidden">
            <!-- ตกแต่งฉากหลัง -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-50 rounded-full blur-2xl -z-0"></div>
            
            <div class="relative z-10 space-y-1">
                <h1 class="text-xl md:text-2xl font-bold text-slate-800">ค้นหาสถานะการจัดส่งพัสดุ</h1>
                <p class="text-xs md:text-sm text-slate-500">กรอกชื่อผู้รับ หรือ เลขพัสดุ เพื่อตรวจสอบประวัติและสถานะ</p>
            </div>

            <div class="relative z-10 flex flex-col sm:flex-row gap-2 max-w-xl mx-auto">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                    <input type="text" id="track-input" placeholder="ใส่ชื่อผู้รับ หรือ เลขพัสดุ..." 
                        class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800 text-sm md:text-base transition-all">
                </div>
                <button onclick="handleTrackSearch()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 text-sm md:text-base">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>ค้นหา</span>
                </button>
            </div>
        </div>

        <!-- กล่องแสดงผลลัพธ์ (เปิด/ปิด อัตโนมัติ) -->
        <div id="track-result" class="hidden space-y-6">

            <!-- ข้อมูลสรุปผู้รับ -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-4">
                    <div>
                        <span class="text-xs text-slate-400 font-medium">ชื่อผู้รับบริการ</span>
                        <h2 id="user-display-name" class="text-xl font-bold text-slate-800"></h2>
                    </div>
                    <div id="risk-badge-container"></div>
                </div>

                <div class="grid grid-cols-3 gap-3 text-center">
                    <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
                        <p class="text-xs text-slate-400 font-medium mb-1">ส่งทั้งหมด</p>
                        <p id="track-total" class="text-xl font-bold text-slate-800">0</p>
                    </div>
                    <div class="bg-emerald-50/60 p-3.5 rounded-2xl border border-emerald-100">
                        <p class="text-xs text-emerald-600 font-medium mb-1">สำเร็จ</p>
                        <p id="track-success" class="text-xl font-bold text-emerald-600">0</p>
                    </div>
                    <div class="bg-rose-50/60 p-3.5 rounded-2xl border border-rose-100">
                        <p class="text-xs text-rose-600 font-medium mb-1">ตีกลับ/ล้มเหลว</p>
                        <p id="track-failed" class="text-xl font-bold text-rose-600">0</p>
                    </div>
                </div>
            </div>

            <!-- ประวัติไทม์ไลน์การจัดส่งล่าสุด (Log History) -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200/80 space-y-4">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> ประวัติการจัดส่งล่าสุด
                </h3>

                <div id="log-timeline" class="space-y-4 pl-2">
                    <!-- รายการ Log จะถูกวาดที่นี่ -->
                </div>
            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script>
        // ฟังการกด Enter ในช่องค้นหา
        document.getElementById('track-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') handleTrackSearch();
        });

        function handleTrackSearch() {
            const query = document.getElementById('track-input').value.trim();
            const resultBox = document.getElementById('track-result');

            if (!query) return;

            const user = DB.findByName(query);

            if (!user) {
                alert('ไม่พบข้อมูลประวัติการจัดส่งของชื่อนี้');
                resultBox.classList.add('hidden');
                return;
            }

            const risk = DB.calculateRisk(user);

            // แสดงข้อมูลผู้รับ
            document.getElementById('user-display-name').innerText = user.name;
            document.getElementById('track-total').innerText = user.total;
            document.getElementById('track-success').innerText = user.success;
            document.getElementById('track-failed').innerText = user.failed;

            // แสดงสถานะความเสี่ยง
            const badgeContainer = document.getElementById('risk-badge-container');
            badgeContainer.innerHTML = `<span class="px-3.5 py-1.5 rounded-full text-xs font-bold inline-block ${risk.colorClass}">${risk.label}</span>`;

            // วาด Timeline ประวัติ
            renderTimeline(user.logs || []);

            resultBox.classList.remove('hidden');
        }

        function renderTimeline(logs) {
            const timelineContainer = document.getElementById('log-timeline');
            timelineContainer.innerHTML = '';

            if (logs.length === 0) {
                timelineContainer.innerHTML = `
                    <div class="text-center py-6 text-slate-400 text-xs">
                        <i class="fa-solid fa-box-open text-2xl mb-2"></i>
                        <p>ยังไม่มีบันทึกประวัติการส่งย่อยในระบบ</p>
                    </div>`;
                return;
            }

            logs.forEach((log, index) => {
                const isSuccess = log.type === 'SUCCESS';
                const item = document.createElement('div');
                item.className = "flex gap-3 relative";

                item.innerHTML = `
                    <!-- เส้นเชื่อม Timeline -->
                    ${index !== logs.length - 1 ? '<div class="absolute left-3 top-7 bottom-0 w-0.5 bg-slate-100"></div>' : ''}
                    
                    <div class="w-6 h-6 rounded-full ${isSuccess ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center text-xs font-bold z-10 shrink-0">
                        <i class="fa-solid ${isSuccess ? 'fa-check' : 'fa-xmark'}"></i>
                    </div>

                    <div class="flex-1 bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold ${isSuccess ? 'text-emerald-700' : 'text-rose-700'}">
                                ${isSuccess ? 'จัดส่งสำเร็จ' : 'ตีกลับ / ปฏิเสธการรับ'}
                            </span>
                            <span class="text-[10px] text-slate-400">${log.timestamp}</span>
                        </div>
                        <p class="text-slate-500 text-[11px]">หมายเลขพัสดุ: <span class="font-semibold text-slate-700">${log.orderId || 'N/A'}</span></p>
                    </div>
                `;
                timelineContainer.appendChild(item);
            });
        }
    </script>
</body>
</html>
