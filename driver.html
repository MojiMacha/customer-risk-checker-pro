<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบความเสี่ยงผู้รับ - Driver Pro</title>
    <!-- Tailwind CSS & FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Header Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-[#01]"></i>
                </div>
                <span class="font-bold text-slate-800 text-lg">Delivery Risk Pro</span>
            </div>
            <div id="staff-badge" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                <span>โหมดผู้ใช้งานทั่วไป</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">

        <!-- กล่องค้นหา (ทุกคนใช้ได้ ไม่ต้องใส่ PIN) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass text-indigo-600"></i> ค้นหาประวัติผู้รับบริการ
            </h2>
            <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="พิมพ์ชื่อผู้รับ..." 
                    class="flex-1 border border-slate-300 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium text-slate-800">
                <button onclick="handleSearch()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md shadow-indigo-100 transition-all active:scale-95">
                    ตรวจสอบ
                </button>
            </div>
        </div>

        <!-- กล่องแสดงผลการค้นหา -->
        <div id="result-box" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-start border-b border-slate-100 pb-4">
                <div>
                    <h3 id="res-name" class="text-xl font-bold text-slate-800"></h3>
                    <p class="text-xs text-slate-400 mt-0.5">ข้อมูลประวัติการจัดส่งสะสม</p>
                </div>
                <span id="res-badge" class="px-3 py-1 rounded-full text-xs font-bold"></span>
            </div>

            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p class="text-xs text-slate-500 font-medium">ส่งทั้งหมด</p>
                    <p id="res-total" class="text-lg font-bold text-slate-800">0</p>
                </div>
                <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                    <p class="text-xs text-emerald-600 font-medium">สำเร็จ</p>
                    <p id="res-success" class="text-lg font-bold text-emerald-700">0</p>
                </div>
                <div class="bg-rose-50 p-3 rounded-xl border border-rose-100">
                    <p class="text-xs text-rose-600 font-medium">ตีกลับ/ล้มเหลว</p>
                    <p id="res-failed" class="text-lg font-bold text-rose-700">0</p>
                </div>
            </div>

            <!-- ส่วนบันทึกประวัติส่ง (สำหรับพนักงานเท่านั้น - ต้องยืนยัน PIN) -->
            <div class="pt-2 border-t border-slate-100">
                <p class="text-xs font-semibold text-slate-500 mb-2">อัปเดตสถานะการจัดส่ง (เฉพาะพนักงาน):</p>
                <div class="flex gap-2">
                    <button onclick="protectedAction('SUCCESS')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all">
                        <i class="fa-solid fa-circle-check mr-1"></i> ส่งสำเร็จ
                    </button>
                    <button onclick="protectedAction('FAILED')" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all">
                        <i class="fa-solid fa-circle-xmark mr-1"></i> ตีกลับ / ปฏิเสธ
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- ================= Modal ยืนยันรหัส PIN พนักงาน (Pop-up สวยงาม) ================= -->
    <div id="pin-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4 border border-slate-100 transform transition-all scale-100">
            <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            
            <div>
                <h3 class="text-lg font-bold text-slate-800">ยืนยันตัวตนพนักงาน</h3>
                <p class="text-xs text-slate-500 mt-1">กรอกรหัส PIN 6 หลักเพื่อดำเนินการต่อ</p>
            </div>

            <div class="space-y-3">
                <input type="password" id="pin-input" maxlength="6" placeholder="• • • • • •" 
                    class="w-full text-center text-2xl tracking-[0.4em] font-bold py-2.5 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none bg-slate-50">
                
                <p id="pin-error" class="text-xs text-rose-500 font-bold hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> รหัส PIN ไม่ถูกต้อง
                </p>

                <div class="flex gap-2">
                    <button onclick="closePinModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-sm transition-all">
                        ยกเลิก
                    </button>
                    <button onclick="verifyAndExecute()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md shadow-indigo-100 transition-all">
                        ตกลง
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script>
        let currentSearchedUser = null;
        let pendingActionType = null;

        // ค้นหารายชื่อ
        function handleSearch() {
            const name = document.getElementById('search-input').value.trim();
            if (!name) return;

            const user = DB.findByName(name);
            const resultBox = document.getElementById('result-box');

            if (!user) {
                alert('ไม่พบข้อมูลรายชื่อนี้ในระบบ');
                resultBox.classList.add('hidden');
                return;
            }

            currentSearchedUser = user;
            const risk = DB.calculateRisk(user);

            document.getElementById('res-name').innerText = user.name;
            document.getElementById('res-total').innerText = user.total;
            document.getElementById('res-success').innerText = user.success;
            document.getElementById('res-failed').innerText = user.failed;

            const badge = document.getElementById('res-badge');
            badge.innerText = risk.label;
            badge.className = `px-3 py-1 rounded-full text-xs font-bold ${risk.colorClass}`;

            resultBox.classList.remove('hidden');
        }

        // ตรวจสอบว่ายืนยัน PIN หรือยัง ก่อนทำรายการพนักงาน
        function protectedAction(type) {
            pendingActionType = type;
            const isAuth = sessionStorage.getItem('staff_logged_in');

            if (isAuth === 'true') {
                executeDeliveryRecord();
            } else {
                openPinModal();
            }
        }

        function openPinModal() {
            document.getElementById('pin-modal').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-error').classList.add('hidden');
            document.getElementById('pin-input').focus();
        }

        function closePinModal() {
            document.getElementById('pin-modal').classList.add('hidden');
            pendingActionType = null;
        }

        function verifyAndExecute() {
            const inputPin = document.getElementById('pin-input').value.trim();
            if (inputPin === CONFIG.STAFF_PIN) {
                sessionStorage.setItem('staff_logged_in', 'true');
                updateStaffBadge();
                closePinModal();
                executeDeliveryRecord();
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        function executeDeliveryRecord() {
            if (!currentSearchedUser || !pendingActionType) return;
            
            DB.recordDelivery(currentSearchedUser.name, pendingActionType, 'ORD-' + Date.now().toString().slice(-4));
            alert(`อัปเดตสถานะให้คุณ ${currentSearchedUser.name} เรียบร้อยแล้ว`);
            handleSearch(); // โหลดข้อมูลใหม่
        }

        function updateStaffBadge() {
            const badge = document.getElementById('staff-badge');
            if (sessionStorage.getItem('staff_logged_in') === 'true') {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>โหมดพนักงาน (อนุมัติแล้ว)</span>`;
                badge.className = "text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full font-bold flex items-center gap-1.5 border border-emerald-200";
            }
        }

        // โหลดสถานะเมื่อเปิดหน้า
        document.addEventListener('DOMContentLoaded', updateStaffBadge);
    </script>
</body>
</html>
