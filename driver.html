<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพนักงานขนส่ง - Delivery Risk Pro</title>
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <!-- 🚚 แถบเมนูด้านบน -->
    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-truck-fast text-amber-400 text-xl"></i>
                <span class="font-bold text-base">ระบบบันทึกงานส่งพัสดุ</span>
            </div>
            <div class="flex items-center space-x-2 text-xs font-medium">
                <a href="driver.html" class="text-white bg-slate-800 px-3 py-1 rounded-lg border border-slate-700 font-bold">พนักงานส่ง</a>
                <a href="admin.html" class="text-slate-300 hover:text-white px-2 py-1">แอดมิน</a>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-4 pt-6 space-y-6">

        <!-- 📦 ฟอร์มค้นหาและลงบันทึกการส่ง -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-5">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold text-slate-800">ลงบันทึกการจัดส่งพัสดุ</h2>
                <p class="text-xs text-slate-400">ระบุเลขออเดอร์ ค้นหาชื่อผู้รับ และเลือกผลการส่ง</p>
            </div>

            <div class="space-y-4">
                <!-- 🏷️ ช่องใส่เลขออเดอร์ / เลขแทร็กกิ้ง -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        <i class="fa-solid fa-barcode text-amber-500 mr-1"></i> รหัสสินค้า / เลขออเดอร์
                    </label>
                    <input type="text" id="order-id-input" placeholder="เช่น TH123600TH" 
                        class="w-full border-2 border-slate-200 p-3 rounded-2xl text-base font-semibold focus:outline-none focus:border-amber-500 uppercase bg-slate-50">
                </div>

                <!-- 👤 ช่องค้นหาชื่อลูกค้า -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">
                        <i class="fa-solid fa-user text-amber-500 mr-1"></i> ชื่อผู้รับพัสดุ
                    </label>
                    <div class="relative">
                        <input type="text" id="driver-search-name" oninput="handleCustomerSearch()" placeholder="พิมพ์ชื่อเพื่อค้นหา..." 
                            class="w-full border-2 border-slate-200 p-3 rounded-2xl text-base font-semibold focus:outline-none focus:border-amber-500 bg-slate-50">
                        <div id="search-dropdown" class="absolute w-full bg-white border border-slate-200 rounded-2xl shadow-xl mt-1 hidden max-h-48 overflow-y-auto z-30 divide-y divide-slate-100"></div>
                    </div>
                </div>

                <!-- ⚠️ กล่องแสดงผลระดับความเสี่ยงของลูกค้า -->
                <div id="risk-alert-box" class="hidden p-4 rounded-2xl border space-y-2">
                    <div class="flex items-center justify-between">
                        <span id="risk-badge" class="px-3 py-1 rounded-full text-xs font-bold"></span>
                        <span id="customer-stats" class="text-xs font-semibold text-slate-500"></span>
                    </div>
                    <p id="blacklist-reason-text" class="text-xs text-rose-600 font-semibold hidden"></p>
                </div>

                <!-- 🔘 ปุ่มกดยืนยันการส่ง -->
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="confirmDelivery('SUCCESS')" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-emerald-100 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-check text-lg"></i>
                        <span>ส่งสำเร็จ</span>
                    </button>

                    <button onclick="confirmDelivery('FAILED')" class="bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-rose-100 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-xmark text-lg"></i>
                        <span>ตีกลับ / ปฏิเสธ</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 📜 ประวัติการบันทึกล่าสุดในเซสชั่นนี้ -->
        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
            <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> ประวัติการบันทึกล่าสุด
            </h3>
            <div id="recent-logs-list" class="space-y-2 text-xs">
                <p class="text-slate-400 text-center py-3">ยังไม่มีรายการบันทึกใหม่ในรอบนี้</p>
            </div>
        </div>

    </main>

    <!-- 🔗 เรียกใช้งานไฟล์ JS -->
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sound.js"></script>

    <script>
        let selectedUser = null;
        const recentLogs = [];

        // 🔓 ปลดล็อกระบบ Audio Context สำหรับเบราว์เซอร์
        function unlockAudio() {
            if (typeof SoundSystem !== 'undefined' && SoundSystem.initAudioContext) {
                SoundSystem.initAudioContext();
            }
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('keydown', unlockAudio);
        }
        document.addEventListener('click', unlockAudio);
        document.addEventListener('keydown', unlockAudio);

        // 🔍 ค้นหารายชื่อลูกค้า
        function handleCustomerSearch() {
            const inputName = document.getElementById('driver-search-name').value.trim();
            const dropdown = document.getElementById('search-dropdown');
            const riskBox = document.getElementById('risk-alert-box');

            if (!inputName || typeof DB === 'undefined') {
                dropdown.classList.add('hidden');
                riskBox.classList.add('hidden');
                selectedUser = null;
                return;
            }

            const allUsers = DB.getAll();
            const matchedUsers = allUsers.filter(u => u.name.toLowerCase().includes(inputName.toLowerCase()));

            if (matchedUsers.length > 0) {
                dropdown.innerHTML = matchedUsers.map(u => `
                    <div onclick="selectCustomer('${u.name}')" class="p-3 hover:bg-slate-50 cursor-pointer flex justify-between items-center">
                        <span class="font-bold text-slate-800 text-sm">${u.name}</span>
                        <span class="text-xs text-slate-400">ส่งสำเร็จ ${u.success}/${u.total}</span>
                    </div>
                `).join('');
                dropdown.classList.remove('hidden');
            } else {
                dropdown.classList.add('hidden');
                showRiskInfo({ name: inputName, success: 0, failed: 0, total: 0, isBlacklisted: false });
            }
        }

        // 📌 เลือกรายชื่อจาก Dropdown
        function selectCustomer(name) {
            const user = DB.findByName(name);
            document.getElementById('driver-search-name').value = name;
            document.getElementById('search-dropdown').classList.add('hidden');
            if (user) {
                selectedUser = user;
                showRiskInfo(user);
            }
        }

        // 🚨 แสดงความเสี่ยงของชื่อที่เลือก
        function showRiskInfo(user) {
            const riskBox = document.getElementById('risk-alert-box');
            const riskBadge = document.getElementById('risk-badge');
            const customerStats = document.getElementById('customer-stats');
            const blReason = document.getElementById('blacklist-reason-text');

            const risk = DB.calculateRisk(user);

            riskBox.className = `p-4 rounded-2xl border space-y-2 ${user.isBlacklisted ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-200'}`;
            riskBadge.className = `px-3 py-1 rounded-full text-xs font-bold ${risk.colorClass}`;
            riskBadge.innerText = risk.label;

            customerStats.innerText = `ประวัติ: สำเร็จ ${user.success} / ตีกลับ ${user.failed} (รวม ${user.total})`;

            if (user.isBlacklisted && user.blacklistReason) {
                blReason.innerText = `⚠️ สาเหตุติดแบล็กลิสต์: ${user.blacklistReason}`;
                blReason.classList.remove('hidden');
            } else {
                blReason.classList.add('hidden');
            }

            riskBox.classList.remove('hidden');
        }

        // 💾 บันทึกการจัดส่ง + เล่นเสียงตามเงื่อนไข
        function confirmDelivery(status) {
            unlockAudio();

            const nameInput = document.getElementById('driver-search-name').value.trim();
            let orderIdInput = document.getElementById('order-id-input').value.trim().toUpperCase();

            if (!nameInput) {
                alert('กรุณากรอกชื่อผู้รับพัสดุ');
                return;
            }

            if (!orderIdInput) {
                orderIdInput = 'TH' + Math.floor(100000 + Math.random() * 900000) + 'TH';
            }

            if (typeof DB !== 'undefined') {
                const updatedUser = DB.recordDelivery(nameInput, status, orderIdInput);
                
                // 🔊 เล่นเสียงตามเงื่อนไข
                if (status === 'SUCCESS') {
                    playSound('SUCCESS'); // เล่น meng.mp3
                } else {
                    playSound('FAILED');  // สุ่มเล่น ghost.mp3 หรือ working.mp3
                }

                // บันทึกลงรายการล่าสุด
                recentLogs.unshift({
                    orderId: orderIdInput,
                    name: nameInput,
                    status: status,
                    time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                });

                renderRecentLogs();

                // ล้างค่า Input
                document.getElementById('driver-search-name').value = '';
                document.getElementById('order-id-input').value = '';
                document.getElementById('risk-alert-box').classList.add('hidden');
                document.getElementById('search-dropdown').classList.add('hidden');
                selectedUser = null;
            }
        }

        // 📜 แสดงผลประวัติล่าสุด
        function renderRecentLogs() {
            const list = document.getElementById('recent-logs-list');
            if (recentLogs.length === 0) return;

            list.innerHTML = recentLogs.slice(0, 5).map(log => `
                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-slate-800">${log.name}</span>
                            <span class="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md font-mono">${log.orderId}</span>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-0.5">เวลา ${log.time} น.</p>
                    </div>
                    <span class="font-bold px-2.5 py-1 rounded-xl text-[11px] ${log.status === 'SUCCESS' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                        ${log.status === 'SUCCESS' ? '🟢 ส่งสำเร็จ' : '🔴 ตีกลับ'}
                    </span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
