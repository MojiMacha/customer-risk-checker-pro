<button onclick="logoutStaff()" class="text-xs text-rose-600 font-bold bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg border border-rose-200 transition-all">
    <i class="fa-solid fa-right-from-bracket mr-1"></i> ออกจากระบบ
</button>
<!-- ================= Modal ยืนยันรหัส PIN ================= -->
<div id="pin-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-5 border border-slate-100">
        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
        </div>
        
        <div>
            <h2 class="text-xl font-bold text-slate-800">ระบบเฉพาะพนักงาน</h2>
            <p class="text-xs text-slate-500 mt-1">กรุณากรอกรหัส PIN 6 หลักเพื่อเข้าใช้งาน</p>
        </div>

        <div class="space-y-3">
            <input type="password" id="pin-input" maxlength="6" placeholder="• • • • • •" 
                class="w-full text-center text-2xl tracking-[0.5em] font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:outline-none transition-all bg-slate-50">
            
            <p id="pin-error" class="text-xs text-rose-500 font-bold hidden">
                <i class="fa-solid fa-circle-exclamation mr-1"></i> รหัส PIN ไม่ถูกต้อง
            </p>

            <button onclick="checkPin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                ยืนยันเข้าสู่ระบบ
            </button>
        </div>
    </div>
</div>

<!-- ================= Script ควบคุมการยืนยันตัวตน ================= -->
<script>
    // ตรวจสอบสถานะการเข้าสู่ระบบเมื่อเปิดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', () => {
        const isAuthenticated = sessionStorage.getItem('staff_logged_in');
        if (isAuthenticated === 'true') {
            document.getElementById('pin-modal').classList.add('hidden');
        }
    });

    // ฟังการกดปุ่ม Enter ในช่องกรอก PIN
    document.getElementById('pin-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkPin();
        }
    });

    // ตรวจสอบรหัส PIN
    function checkPin() {
        const inputPin = document.getElementById('pin-input').value.trim();
        const errorMsg = document.getElementById('pin-error');

        if (inputPin === CONFIG.STAFF_PIN) {
            sessionStorage.setItem('staff_logged_in', 'true');
            document.getElementById('pin-modal').classList.add('hidden');
            errorMsg.classList.add('hidden');
        } else {
            errorMsg.classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
        }
    }

    // ฟังก์ชันออกจากระบบ (เรียกใช้เมื่อต้องการ ล็อกเอ้าท์)
    function logoutStaff() {
        sessionStorage.removeItem('staff_logged_in');
        location.reload();
    }
</script>
