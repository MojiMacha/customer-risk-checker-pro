<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพนักงานส่ง - Delivery Risk Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <div id="auth-screen" class="fixed inset-0 bg-slate-900/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-5 border border-slate-100">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                <i class="fa-solid fa-truck-fast"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-slate-800">เข้าสู่ระบบพนักงานส่ง</h2>
                <p class="text-xs text-slate-500 mt-1">กรุณากรอกรหัส PIN พนักงานส่ง (6 หลัก)</p>
            </div>
            <div class="space-y-3">
                <input type="password" id="pin-input" maxlength="6" placeholder="• • • • • •" 
                    class="w-full text-center text-2xl tracking-[0.4em] font-bold py-3 border-2 border-slate-200 rounded-2xl focus:border-indigo-500 focus:outline-none bg-slate-50">
                <p id="pin-error" class="text-xs text-rose-500 font-bold hidden">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> รหัส PIN ไม่ถูกต้อง!
                </p>
                <button onclick="loginStaff()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                    เข้าสู่ระบบ
                </button>
            </div>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <nav class="bg-indigo-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <button onclick="history.back()" class="flex items-center gap-1.5 text-xs bg-indigo-800/80 hover:bg-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-700/60 transition-all active:scale-95">
                        <i class="fa-solid fa-arrow-left"></i> <span>ย้อนกลับ</span>
                    </button>
                    <span class="font-bold text-base md:text-lg">🚚 พนักงานส่ง</span>
                </div>
                <div class="flex items-center space-x-3 text-xs md:text-sm font-medium">
                    <a href="driver.html" class="text-white bg-indigo-800/90 px-3 py-1 rounded-lg border border-indigo-700/50 font-bold">พนักงานส่ง</a>
                    <a href="admin.html" class="text-indigo-200 hover:text-white px-2 py-1">แอดมิน</a>
                    <a href="blacklist.html" class="text-indigo-200 hover:text-white px-2 py-1">แบล็กลิสต์</a>
                    <a href="tracking.html" class="text-indigo-200 hover:text-white px-2 py-1">ลูกค้า</a>
                    <button onclick="logoutStaff()" class="text-rose-300 hover:text-rose-100 bg-rose-950/40 px-2.5 py-1 rounded-lg border border-rose-800/50">ออกจากระบบ</button>
                </div>
            </div>
        </nav>

        <main class="max-w-3xl mx-auto px-4 pt-6 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass text-indigo-600"></i> ค้นหาผู้รับเพื่ออัปเดตการจัดส่ง
                </h2>
                <div class="flex gap-2">
                    <input type="text" id="search-input" placeholder="พิมพ์ชื่อผู้รับ..." class="flex-1 border border-slate-300 p-3 rounded-2xl font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="handleSearch()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-2xl shadow-md">ค้นหา</button>
                </div>
            </div>

            <div id="result-box" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                
                <div id="risk-alert-banner" class="hidden bg-rose-50 border border-rose-200 text-rose-700 p-3.5 rounded-2xl text-xs font-bold flex items-center gap-2 animate-pulse">
                    <i class="fa-solid fa-triangle-exclamation text-lg text-rose-600"></i>
                    <span id="risk-alert-text">คำเตือน: ผู้รับรายนี้มีความเสี่ยงสูง/ติดแบล็กลิสต์</span>
                </div>

                <div class="flex justify-between items-start border-b pb-4">
                    <div>
                        <h3 id="res-name" class="text-xl font-bold text-slate-800"></h3>
                        <p class="text-xs text-slate-400">ประวัติการรับพัสดุ</p>
                    </div>
                    <div id="res-badge"></div>
                </div>

                <div class="grid grid-cols-3 gap-3 text-center">
                    <div class="bg-slate-50 p-3 rounded-2xl border"><p class="text-xs text-slate-500">ส่งทั้งหมด</p><p id="res-total" class="text-lg font-bold">0</p></div>
                    <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100"><p class="text-xs text-emerald-600">สำเร็จ</p><p id="res-success" class="text-lg font-bold text-emerald-600">0</p></div>
                    <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100"><p class="text-xs text-rose-600">ตีกลับ</p><p id="res-failed" class="text-lg font-bold text-rose-600">0</p></div>
                </div>

                <div class="pt-2 border-t space-y-2">
                    <div class="flex gap-2">
                        <button onclick="askConfirm('SUCCESS')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl shadow-md active:scale-95 transition-all">
                            <i class="fa-solid fa-check mr-1"></i> ส่งสำเร็จ
                        </button>
                        <button onclick="askConfirm('FAILED')" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-2xl shadow-md active:scale-95 transition-all">
                            <i class="fa-solid fa-xmark mr-1"></i> ตีกลับ / ปฏิเสธ
                        </button>
                    </div>

                    <button id="undo-btn" onclick="undoLastRecord()" class="hidden w-full bg-amber-50 hover:bg-amber-100 text-amber-700 font-bold py-2.5 rounded-2xl border border-amber-200 text-xs transition-all flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span>เลิกทำรายการล่าสุด (กรณีเผลอกดผิด)</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4 border border-slate-100">
            <div id="confirm-icon" class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner"></div>
            <div>
                <h3 class="text-lg font-bold text-slate-800">ยืนยันการทำรายการ</h3>
                <p id="confirm-text" class="text-xs text-slate-500 mt-1"></p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeConfirmModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2.5 rounded-xl text-sm transition-all">
                    ยกเลิก
                </button>
                <button id="confirm-submit-btn" onclick="executeRecord()" class="flex-1 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition-all">
                    ยืนยัน
                </button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/sound.js"></script> <script>
        let currentSearchedUser = null;
        let pendingType = null;
        let lastActionRecord = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('staff_role') === 'DRIVER' || sessionStorage.getItem('staff_logged_in') === 'true') {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            }
        });

        function loginStaff() {
            const inputPin = document.getElementById('pin-input').value.trim();
            if (inputPin === (CONFIG.DRIVER_PIN || CONFIG.STAFF_PIN || '001456')) {
                sessionStorage.setItem('staff_role', 'DRIVER');
                sessionStorage.setItem('staff_logged_in', 'true');
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } else {
                playSound('failed'); // 🔊 เรียกเล่นเสียงจาก sound.js
                document.getElementById('pin-error').classList.remove('hidden');
                document.getElementById('pin-input').value = '';
            }
        }

        function logoutStaff() {
            sessionStorage.removeItem('staff_role');
            sessionStorage.removeItem('staff_logged_in');
            location.reload();
        }

        function handleSearch() {
            const name = document.getElementById('search-input').value.trim();
            if (!name) return;
            const user = DB.findByName(name);
            if (!user) { alert('ไม่พบข้อมูลรายชื่อนี้'); return; }
            
            currentSearchedUser = user;
            lastActionRecord = null;
            document.getElementById('undo-btn').classList.add('hidden');

            const risk = DB.calculateRisk(user);

            // 🔊 เรียกใช้เสียงตามระดับความเสี่ยงผ่าน SoundSystem (บรรทัดเดียวจบ!)
            SoundSystem.playByRisk(user, risk.level);

            // แสดงแบนเนอร์แจ้งเตือน
            const alertBanner = document.getElementById('risk-alert-banner');
            if (user.isBlacklisted || risk.level === 'HIGH') {
                alertBanner.classList.remove('hidden');
                document.getElementById('risk-alert-text').innerText = user.isBlacklisted 
                    ? `⚠️ รายชื่อนี้ติดแบล็กลิสต์: ${user.blacklistReason || 'ปฏิเสธการชำระเงิน'}`
                    : `⚠️ คำเตือน: ลูกค้ารายนี้มีประวัติตีกลับสูง (${user.failed} ครั้ง)`;
            } else {
                alertBanner.classList.add('hidden');
            }

            refreshUserDisplay();
            document.getElementById('result-box').classList.remove('hidden');
        }

        function refreshUserDisplay() {
            const user = DB.findByName(currentSearchedUser.name);
            currentSearchedUser = user;
            const risk = DB.calculateRisk(user);

            document.getElementById('res-name').innerText = user.name;
            document.getElementById('res-total').innerText = user.total;
            document.getElementById('res-success').innerText = user.success;
            document.getElementById('res-failed').innerText = user.failed;
            document.getElementById('res-badge').innerHTML = `<span class="px-3 py-1 rounded-full text-xs font-bold ${risk.colorClass}">${risk.label}</span>`;
        }

        function askConfirm(type) {
            if (!currentSearchedUser) return;
            pendingType = type;

            const iconBox = document.getElementById('confirm-icon');
            const submitBtn = document.getElementById('confirm-submit-btn');
            const confirmText = document.getElementById('confirm-text');

            if (type === 'SUCCESS') {
                iconBox.className = "w-14 h-14 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner";
                iconBox.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
                confirmText.innerText = `ต้องการบันทึกสถานะ "ส่งสำเร็จ" ใช่หรือไม่?`;
                submitBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition-all";
            } else {
                iconBox.className = "w-14 h-14 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-inner";
                iconBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i>`;
                confirmText.innerText = `ต้องการบันทึกสถานะ "ตีกลับ / ปฏิเสธ" ใช่หรือไม่?`;
                submitBtn.className = "flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition-all";
            }

            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingType = null;
        }

        function executeRecord() {
            if (!currentSearchedUser || !pendingType) return;

            // 🔊 เล่นเสียงตามประเภทปุ่มที่กด
            if (pendingType === 'SUCCESS') playSound('success');
            else playSound('failed');

            lastActionRecord = { userName: currentSearchedUser.name, type: pendingType };
            DB.recordDelivery(currentSearchedUser.name, pendingType, 'ORD-' + Date.now().toString().slice(-4));
            
            closeConfirmModal();
            refreshUserDisplay();
            document.getElementById('undo-btn').classList.remove('hidden');
        }

        function undoLastRecord() {
            if (!lastActionRecord) return;
            const list = DB.getAll();
            const user = list.find(u => u.name === lastActionRecord.userName);

            if (user) {
                if (lastActionRecord.type === 'SUCCESS' && user.success > 0) user.success--;
                else if (lastActionRecord.type === 'FAILED' && user.failed > 0) user.failed--;
                user.total = user.success + user.failed;
                if (user.logs && user.logs.length > 0) user.logs.shift();

                DB.save(list);
                alert('ยกเลิกรายการล่าสุดเรียบร้อยแล้ว');
                lastActionRecord = null;
                document.getElementById('undo-btn').classList.add('hidden');
                refreshUserDisplay();
            }
        }
    </script>
</body>
</html>
