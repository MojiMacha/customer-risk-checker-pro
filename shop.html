        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"

        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap"

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
        }

        .product-card {
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
        }

        .product-image {
            transition: transform 0.35s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .modal-animation {
            animation: modalIn 0.22s ease;
        }

        .toast-animation {
            animation: toastIn 0.25s ease;
        }

        @keyframes modalIn {

            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }

        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

    </style>

</head>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

let cart = [];
let currentCategory = 'all';


/* =====================================================
   DATA
===================================================== */

function getProducts() {

    try {

        if (
            typeof products !== 'undefined' &&
            Array.isArray(products)
        ) {
            return products;
        }

    } catch (error) {

        console.error('[SHOP] products error:', error);

    }

    return [];

}


function getShops() {

    try {

        if (
            typeof shops !== 'undefined' &&
            Array.isArray(shops)
        ) {
            return shops;
        }

    } catch (error) {

        console.error('[SHOP] shops error:', error);

    }

    return [];

}


function getProductById(id) {

    return getProducts().find(
        product =>
            String(product.id).trim() === String(id).trim()
    );

}


function getShopById(id) {

    return getShops().find(
        shop =>
            String(shop.id).trim() === String(id).trim()
    );

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


function formatMoney(value) {

    const number = Number(value) || 0;

    return '฿' + number.toLocaleString('th-TH');

}


function fallbackImage() {

    return 'https://placehold.co/600x600/e2e8f0/64748b?text=No+Image';

}


function getProductImage(product) {

    return (
        product.image ||
        product.imageUrl ||
        product.thumbnail ||
        product.img ||
        fallbackImage()
    );

}


function getProductName(product) {

    return product.name || product.title || 'สินค้า';

}


function getProductPrice(product) {

    return Number(
        product.price ??
        product.salePrice ??
        product.amount ??
        0
    ) || 0;

}


/* =====================================================
   ERROR
===================================================== */

function showDataError(message) {

    const box =
        document.getElementById('data-error');

    const messageBox =
        document.getElementById('data-error-message');

    if (!box || !messageBox) return;

    box.classList.remove('hidden');

    messageBox.textContent = message;

}


function hideDataError() {

    const box =
        document.getElementById('data-error');

    if (box) {

        box.classList.add('hidden');

    }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

    const grid =
        document.getElementById('product-grid');

    const count =
        document.getElementById('product-count');

    if (!grid) return;

    const productList =
        getProducts();


    console.log('[SHOP] products:', productList);
    console.log('[SHOP] shops:', getShops());


    if (!productList.length) {

        grid.innerHTML = '';

        if (count) {

            count.textContent =
                '0 สินค้า';

        }

        showDataError(
            'ไม่พบข้อมูล products จาก js/products.js'
        );

        return;

    }


    hideDataError();


    const searchInput =
        document.getElementById('search-input');


    const keyword =
        searchInput
            ? searchInput.value.trim().toLowerCase()
            : '';


    const filtered =
        productList.filter(product => {

            const shop =
                getShopById(product.shopId);


            const categoryMatch =
                currentCategory === 'all' ||
                String(product.category || '').toLowerCase() ===
                currentCategory.toLowerCase();


            const productText = [

                product.name,
                product.title,
                product.description,
                product.category,
                shop?.name

            ]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();


            const searchMatch =
                !keyword ||
                productText.includes(keyword);


            return categoryMatch && searchMatch;

        });


    if (count) {

        count.textContent =
            `${filtered.length} สินค้า`;

    }


    if (!filtered.length) {

        grid.innerHTML = `

            <div class="col-span-full bg-white rounded-3xl
                p-10 text-center shadow-sm">

                <div
                    class="w-16 h-16 mx-auto rounded-2xl
                    bg-slate-100 flex items-center justify-center
                    text-2xl"
                >
                    🔍
                </div>

                <h3 class="font-black text-lg mt-4">
                    ไม่พบสินค้าที่ค้นหา
                </h3>

                <p class="text-sm text-slate-400 mt-1">
                    ลองเปลี่ยนคำค้นหาหรือหมวดหมู่
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered.map(product => {

            const shop =
                getShopById(product.shopId);

            const image =
                getProductImage(product);

            const name =
                getProductName(product);

            const price =
                getProductPrice(product);

            const shopName =
                shop?.name || 'ร้านค้า';


            return `

                <article
                    class="product-card bg-white rounded-3xl
                    overflow-hidden shadow-sm border border-slate-100"
                    onclick="openProduct('${escapeHTML(product.id)}')"
                >

                    <div class="relative bg-slate-100">

                        <img
                            src="${escapeHTML(image)}"
                            alt="${escapeHTML(name)}"
                            class="product-image w-full aspect-square
                            object-cover"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='${fallbackImage()}'"
                        >

                        <span
                            class="absolute top-3 left-3
                            px-2.5 py-1 rounded-xl
                            bg-white/90 backdrop-blur
                            text-[10px] font-bold
                            text-slate-700"
                        >
                            ${escapeHTML(product.category || 'สินค้า')}
                        </span>

                    </div>


                    <div class="p-4">

                        <p
                            class="text-[11px] text-indigo-600
                            font-bold truncate"
                        >

                            <i class="fa-solid fa-store mr-1"></i>

                            ${escapeHTML(shopName)}

                        </p>


                        <h3
                            class="font-black mt-1 line-clamp-2"
                        >
                            ${escapeHTML(name)}
                        </h3>


                        <p
                            class="text-xs text-slate-400
                            mt-2 line-clamp-2"
                        >
                            ${escapeHTML(product.description || '')}
                        </p>


                        <div
                            class="flex items-center
                            justify-between mt-4 gap-2"
                        >

                            <span
                                class="text-lg font-black
                                text-indigo-600"
                            >
                                ${formatMoney(price)}
                            </span>


                            <button
                                type="button"
                                onclick="event.stopPropagation();addToCart('${escapeHTML(product.id)}')"
                                class="w-10 h-10 shrink-0
                                rounded-xl bg-indigo-600
                                hover:bg-indigo-700
                                text-white flex items-center
                                justify-center"
                            >

                                <i class="fa-solid fa-cart-plus"></i>

                            </button>

                        </div>

                    </div>

                </article>

            `;

        })
        .join('');

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category) {

    currentCategory =
        category || 'all';


    document.querySelectorAll('.category-btn')
        .forEach(button => {

            const active =
                button.dataset.category ===
                currentCategory;


            if (active) {

                button.classList.remove(
                    'bg-white',
                    'text-slate-800',
                    'border',
                    'border-slate-200'
                );

                button.classList.add(
                    'bg-indigo-600',
                    'text-white'
                );

            } else {

                button.classList.remove(
                    'bg-indigo-600',
                    'text-white'
                );

                button.classList.add(
                    'bg-white',
                    'border',
                    'border-slate-200'
                );

            }

        });


    renderProducts();

}


/* =====================================================
   PRODUCT MODAL
===================================================== */

function openProduct(id) {

    const product =
        getProductById(id);


    if (!product) {

        showToast('ไม่พบข้อมูลสินค้า');

        return;

    }


    const shop =
        getShopById(product.shopId);

    const image =
        getProductImage(product);

    const name =
        getProductName(product);

    const price =
        getProductPrice(product);


    const modal =
        document.getElementById('product-modal');

    const content =
        document.getElementById('product-modal-content');


    content.innerHTML = `

        <div class="relative">

            <button
                type="button"
                onclick="closeProduct()"
                class="absolute right-4 top-4 z-10
                w-10 h-10 rounded-xl
                bg-white/90 shadow
                flex items-center justify-center"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>


            <div class="grid md:grid-cols-2">

                <div class="bg-slate-100">

                    <img
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(name)}"
                        class="w-full aspect-square object-cover"
                        onerror="this.onerror=null;this.src='${fallbackImage()}'"
                    >

                </div>


                <div class="p-6">

                    <p
                        class="text-xs font-bold
                        text-indigo-600"
                    >

                        <i class="fa-solid fa-store mr-1"></i>

                        ${escapeHTML(shop?.name || 'ร้านค้า')}

                    </p>


                    <h2
                        class="text-2xl font-black mt-2"
                    >
                        ${escapeHTML(name)}
                    </h2>


                    <p
                        class="text-2xl font-black
                        text-indigo-600 mt-4"
                    >
                        ${formatMoney(price)}
                    </p>


                    <p
                        class="text-sm text-slate-500
                        leading-7 mt-5"
                    >
                        ${escapeHTML(
                            product.description ||
                            'ไม่มีรายละเอียดสินค้า'
                        )}
                    </p>


                    <div class="mt-6">

                        <button
                            type="button"
                            onclick="addToCart('${escapeHTML(product.id)}');closeProduct()"
                            class="w-full py-3 rounded-2xl
                            bg-indigo-600 hover:bg-indigo-700
                            text-white font-bold"
                        >

                            <i class="fa-solid fa-cart-plus mr-2"></i>

                            เพิ่มลงตะกร้า

                        </button>

                    </div>

                </div>

            </div>

        </div>

    `;


    modal.classList.remove('hidden');

    document.body.classList.add('overflow-hidden');

}


function closeProduct(event) {

    if (
        event &&
        event.target &&
        event.target.id !== 'product-modal'
    ) {
        return;
    }


    const modal =
        document.getElementById('product-modal');


    modal.classList.add('hidden');

    document.body.classList.remove('overflow-hidden');

}


/* =====================================================
   CART
===================================================== */

function loadCart() {

    try {

        const saved =
            localStorage.getItem('cart');


        if (!saved) {

            cart = [];

            return;

        }


        const parsed =
            JSON.parse(saved);


        if (Array.isArray(parsed)) {

            cart = parsed;

        } else {

            cart = [];

        }

    } catch (error) {

        console.error(
            '[SHOP] Cannot load cart:',
            error
        );

        cart = [];

    }

}


function saveCart() {

    try {

        localStorage.setItem(
            'cart',
            JSON.stringify(cart)
        );

    } catch (error) {

        console.error(
            '[SHOP] Cannot save cart:',
            error
        );

    }

}


function addToCart(productId) {

    const product =
        getProductById(productId);


    if (!product) {

        showToast('ไม่พบสินค้านี้');

        return;

    }


    const id =
        String(product.id);


    const existing =
        cart.find(
            item =>
                String(item.id) === id
        );


    if (existing) {

        existing.quantity =
            Number(existing.quantity || 1) + 1;

    } else {

        cart.push({

            id: product.id,

            productId: product.id,

            name: getProductName(product),

            price: getProductPrice(product),

            image: getProductImage(product),

            shopId: product.shopId,

            quantity: 1

        });

    }


    saveCart();

    updateCartUI();


    showToast(
        `เพิ่ม "${getProductName(product)}" ลงตะกร้าแล้ว`
    );

}


function increaseCart(productId) {

    const item =
        cart.find(
            cartItem =>
                String(cartItem.id) ===
                String(productId)
        );


    if (!item) return;


    item.quantity =
        Number(item.quantity || 1) + 1;


    saveCart();

    updateCartUI();

}


function decreaseCart(productId) {

    const item =
        cart.find(
            cartItem =>
                String(cartItem.id) ===
                String(productId)
        );


    if (!item) return;


    item.quantity =
        Number(item.quantity || 1) - 1;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                cartItem =>
                    String(cartItem.id) !==
                    String(productId)
            );

    }


    saveCart();

    updateCartUI();

}


function removeFromCart(productId) {

    cart =
        cart.filter(
            item =>
                String(item.id) !==
                String(productId)
        );


    saveCart();

    updateCartUI();

}


/* =====================================================
   CART UI
===================================================== */

function getCartQuantity() {

    return cart.reduce(
        (total, item) =>
            total + Number(item.quantity || 0),
        0
    );

}


function getCartTotal() {

    return cart.reduce(
        (total, item) =>
            total +
            Number(item.price || 0) *
            Number(item.quantity || 0),
        0
    );

}


function updateCartUI() {

    const count =
        document.getElementById('cart-count');

    const summary =
        document.getElementById('cart-summary');

    const total =
        document.getElementById('cart-total');

    const items =
        document.getElementById('cart-items');


    const quantity =
        getCartQuantity();


    if (count) {

        count.textContent =
            quantity;


        if (quantity > 0) {

            count.classList.remove('hidden');

            count.classList.add('flex');

        } else {

            count.classList.add('hidden');

            count.classList.remove('flex');

        }

    }


    if (summary) {

        summary.textContent =
            `${quantity} รายการ`;

    }


    if (total) {

        total.textContent =
            formatMoney(getCartTotal());

    }


    if (!items) return;


    if (!cart.length) {

        items.innerHTML = `

            <div class="py-10 text-center">

                <div
                    class="w-16 h-16 mx-auto rounded-2xl
                    bg-slate-100 flex items-center justify-center
                    text-2xl"
                >
                    🛒
                </div>

                <h3 class="font-black mt-4">
                    ตะกร้ายังว่างอยู่
                </h3>

                <p class="text-xs text-slate-400 mt-1">
                    เลือกสินค้าแล้วกดเพิ่มลงตะกร้า
                </p>

            </div>

        `;

        return;

    }


    items.innerHTML =
        cart.map(item => {

            return `

                <div
                    class="bg-slate-50 rounded-2xl p-3
                    flex gap-3"
                >

                    <img
                        src="${escapeHTML(item.image || fallbackImage())}"
                        class="w-16 h-16 rounded-xl object-cover"
                        onerror="this.onerror=null;this.src='${fallbackImage()}'"
                    >


                    <div class="flex-1 min-w-0">

                        <p
                            class="font-bold text-sm
                            truncate"
                        >
                            ${escapeHTML(item.name)}
                        </p>


                        <p
                            class="text-sm font-black
                            text-indigo-600 mt-1"
                        >
                            ${formatMoney(item.price)}
                        </p>


                        <div
                            class="flex items-center
                            justify-between mt-2"
                        >

                            <div
                                class="flex items-center
                                bg-white rounded-xl
                                border border-slate-200"
                            >

                                <button
                                    type="button"
                                    onclick="decreaseCart('${escapeHTML(item.id)}')"
                                    class="w-8 h-8"
                                >
                                    −
                                </button>


                                <span
                                    class="w-8 text-center
                                    text-xs font-bold"
                                >
                                    ${Number(item.quantity || 1)}
                                </span>


                                <button
                                    type="button"
                                    onclick="increaseCart('${escapeHTML(item.id)}')"
                                    class="w-8 h-8"
                                >
                                    +
                                </button>

                            </div>


                            <button
                                type="button"
                                onclick="removeFromCart('${escapeHTML(item.id)}')"
                                class="text-rose-500 text-xs font-bold"
                            >

                                <i class="fa-solid fa-trash mr-1"></i>

                                ลบ

                            </button>

                        </div>

                    </div>

                </div>

            `;

        })
        .join('');

}


function openCart() {

    const modal =
        document.getElementById('cart-modal');


    modal.classList.remove('hidden');

    updateCartUI();

}


function closeCart(event) {

    if (
        event &&
        event.target &&
        event.target.id !== 'cart-modal'
    ) {
        return;
    }


    document
        .getElementById('cart-modal')
        .classList.add('hidden');

}


/* =====================================================
   CHECKOUT
   สำคัญ:
   ห้ามสร้าง Order ตรงนี้
   ให้ไป checkout.html ก่อน
===================================================== */

function checkout() {

    if (!cart.length) {

        showToast('ตะกร้ายังว่างอยู่');

        return;

    }


    /*
       ตรวจสอบให้แน่ใจว่าตะกร้าถูกบันทึก
       ก่อนเปลี่ยนหน้า
    */

    saveCart();


    /*
       ไปหน้า Checkout
    */

    window.location.href =
        'checkout.html';

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(message) {

    const toast =
        document.getElementById('toast');


    if (!toast) return;


    toast.textContent =
        message;


    toast.classList.remove('hidden');

    toast.classList.add('toast-animation');


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(() => {

            toast.classList.add('hidden');

            toast.classList.remove('toast-animation');

        }, 2200);

}


/* =====================================================
   EVENTS
===================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function () {

        loadCart();

        updateCartUI();

        renderProducts();


        const searchInput =
            document.getElementById('search-input');


        if (searchInput) {

            searchInput.addEventListener(
                'input',
                renderProducts
            );

        }


        document.addEventListener(
            'keydown',
            function (event) {

                if (event.key === 'Escape') {

                    closeProduct();

                    closeCart();

                }

            }
        );

    }
);

</script>
