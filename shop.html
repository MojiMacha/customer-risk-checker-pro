                    scale(1)
                    translateY(0);

<script>


/* =====================================================
   VARIABLES
===================================================== */

let cart = [];

let currentCategory = "all";


/* =====================================================
   GET SHOP
===================================================== */

function getShopById(shopId) {

    if (
        typeof shops === "undefined" ||
        !Array.isArray(shops)
    ) {

        return null;

    }


    return shops.find(
        shop => shop.id === shopId
    ) || null;

}


/* =====================================================
   GET PRODUCT
===================================================== */

function getProductById(productId) {

    if (
        typeof products === "undefined" ||
        !Array.isArray(products)
    ) {

        return null;

    }


    return products.find(
        product => product.id === productId
    ) || null;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (value === undefined || value === null) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

    const grid =
        document.getElementById(
            "product-grid"
        );


    if (!grid) {

        return;

    }


    if (
        typeof products === "undefined" ||
        !Array.isArray(products)
    ) {

        grid.innerHTML = `

            <div
                class="
                    col-span-full
                    bg-white
                    rounded-3xl
                    p-10
                    text-center
                "
            >

                <p
                    class="
                        text-rose-500
                        font-bold
                    "
                >
                    ไม่พบ products.js
                </p>

            </div>

        `;

        return;

    }


    const searchInput =
        document.getElementById(
            "search-input"
        );


    const keyword =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    const filtered =
        products.filter(product => {

            const shop =
                getShopById(
                    product.shopId
                );


            const matchCategory =
                currentCategory === "all" ||
                product.category === currentCategory;


            const matchName =
                String(
                    product.name || ""
                )
                .toLowerCase()
                .includes(keyword);


            const matchDescription =
                String(
                    product.description || ""
                )
                .toLowerCase()
                .includes(keyword);


            const matchShop =
                shop &&
                String(
                    shop.name || ""
                )
                .toLowerCase()
                .includes(keyword);


            const matchSearch =
                keyword === "" ||
                matchName ||
                matchDescription ||
                matchShop;


            return (
                matchCategory &&
                matchSearch
            );

        });


    document
        .getElementById(
            "product-count"
        )
        .innerText =
        `${filtered.length} สินค้า`;


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div
                class="
                    col-span-full
                    bg-white
                    rounded-3xl
                    border
                    border-slate-200
                    p-10
                    text-center
                "
            >

                <i
                    class="
                        fa-solid
                        fa-box-open
                        text-4xl
                        text-slate-300
                    "
                ></i>


                <p
                    class="
                        font-bold
                        text-slate-500
                        mt-3
                    "
                >
                    ไม่พบสินค้าที่ค้นหา
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        filtered
        .map(product => {

            const shop =
                getShopById(
                    product.shopId
                );


            const shopName =
                shop
                    ? escapeHtml(shop.name)
                    : "ร้านค้า";


            const shopLogo =
                shop && shop.logo
                    ? shop.logo
                    : "https://placehold.co/100x100/e2e8f0/64748b?text=Shop";


            const productImage =
                product.image ||
                "https://placehold.co/600x600/e2e8f0/64748b?text=No+Image";


            const productName =
                escapeHtml(
                    product.name
                );


            const productDescription =
                escapeHtml(
                    product.description
                );


            const rating =
                Number(
                    product.rating || 0
                );


            const price =
                Number(
                    product.price || 0
                );


            return `

                <div
                    class="
                        product-card
                        bg-white
                        rounded-3xl
                        border
                        border-slate-200
                        overflow-hidden
                        cursor-pointer
                    "
                    onclick="
                        openProductModal('${product.id}')
                    "
                >


                    <!-- IMAGE -->

                    <div
                        class="
                            h-56
                            bg-slate-100
                            overflow-hidden
                            relative
                        "
                    >

                        <img
                            src="${productImage}"
                            alt="${productName}"
                            class="
                                product-image
                                w-full
                                h-full
                                object-cover
                            "
                            onerror="
                                this.src='https://placehold.co/600x600/e2e8f0/64748b?text=No+Image'
                            "
                        >


                        ${
                            shop && shop.mall
                            ?

                            `

                            <span
                                class="
                                    absolute
                                    top-3
                                    left-3
                                    bg-orange-500
                                    text-white
                                    px-2.5
                                    py-1
                                    rounded-lg
                                    text-[10px]
                                    font-black
                                    shadow
                                "
                            >

                                <i
                                    class="
                                        fa-solid
                                        fa-shield
                                        mr-1
                                    "
                                ></i>

                                MALL

                            </span>

                            `

                            :

                            ""

                        }


                        <!-- VIEW -->

                        <div
                            class="
                                absolute
                                bottom-3
                                right-3
                                bg-slate-950/70
                                text-white
                                px-3
                                py-1.5
                                rounded-xl
                                text-[10px]
                                font-bold
                                opacity-0
                                hover:opacity-100
                                transition
                            "
                        >

                            <i
                                class="
                                    fa-solid
                                    fa-eye
                                    mr-1

/* =====================================================
   CLOSE PRODUCT MODAL
===================================================== */

function closeProductModal(event) {

    if (
        event &&
        event.target !== event.currentTarget
    ) {

        return;

    }


    const modal =
        document.getElementById(
            "product-modal"
        );


    modal.classList.add(
        "hidden"
    );


    document.body.classList.remove(
        "overflow-hidden"
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(productId) {

    const product =
        getProductById(
            productId
        );


    if (!product) {

        alert(
            "ไม่พบสินค้านี้"
        );

        return;

    }


    const existing =
        cart.find(
            item => item.id === productId
        );


    if (existing) {

        existing.quantity += 1;

    }

    else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    updateCart();

    openCart();

}


/* =====================================================
   ADD TO CART FROM PRODUCT MODAL
===================================================== */

function addToCartFromModal(productId) {

    const product =
        getProductById(
            productId
        );


    if (!product) {

        return;

    }


    const existing =
        cart.find(
            item => item.id === productId
        );


    if (existing) {

        existing.quantity++;

    }

    else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    updateCart();

    closeProductModal();

    openCart();

}


/* =====================================================
   REMOVE FROM CART
===================================================== */

function removeFromCart(productId) {

    cart =
        cart.filter(
            item => item.id !== productId
        );


    updateCart();

}


/* =====================================================
   CHANGE QUANTITY
===================================================== */

function changeQuantity(
    productId,
    amount
) {

    const item =
        cart.find(
            item => item.id === productId
        );


    if (!item) {

        return;

    }


    item.quantity += amount;


    if (item.quantity <= 0) {

        removeFromCart(
            productId
        );

        return;

    }


    updateCart();

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

    const count =
        cart.reduce(
            (sum, item) =>
                sum + item.quantity,
            0
        );


    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                (
                    Number(item.price) *
                    item.quantity
                ),
            0
        );


    const badge =
        document.getElementById(
            "cart-count"
        );


    if (badge) {

        badge.innerText =
            count;


        if (count > 0) {

            badge.classList.remove(
                "hidden"
            );


            badge.classList.add(
                "cart-badge"
            );

        }

        else {

            badge.classList.add(
                "hidden"
            );

        }

    }


    const summary =
        document.getElementById(
            "cart-summary"
        );


    if (summary) {

        summary.innerText =
            `${count} รายการ`;

    }


    const totalElement =
        document.getElementById(
            "cart-total"
        );


    if (totalElement) {

        totalElement.innerText =
            `฿${total.toLocaleString()}`;

    }


    renderCart();

}
