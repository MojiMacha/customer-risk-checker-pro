<script>

/* =====================================================
   PRODUCT DATA
===================================================== */

const products = [

    {
        id: 1,

        image: "images/products/product.html?id=1",

        name: "Dr.PONG 28D Smart Whitening Drone Activein Serum",

        description: "เป็นเซรั่มบำรุงผิวหน้าสูตรกระจ่างใส ช่วยลดเลือนจุดด่างดำและรอยสิวด้วยเทคโนโลยี activeIN™ ที่ช่วยให้สารบำรุงซึมลึกเข้าสู่ผิวได้ดีขึ้น 11.5 เท่า ข้อมูลและคุณสมบัติเด่นสารสำคัญหลัก: ผสาน 5% Niacinamide, Arbutin และ Vitamin Cสรรพคุณ: ช่วยปรับสีผิวให้สม่ำเสมอ แลดูกระจ่างใส และลดเลือนรอยดำจากสิวความปลอดภัย: ปราศจากสี พาราเบน น้ำหอม และสเตียรอยด์ เหมาะสำหรับทุกสภาพผิวรวมถึงผิวแพ้ง่าย (ใช้ได้ตั้งแต่อายุ 15 ปีขึ้นไป)วิธีใช้: ทาบำรุงทั่วใบหน้าเป็นประจำเช้า-เย็น แนะนำให้ทาตอนหน้าหมาดๆ เพื่อช่วยกักเก็บความชุ่มชื้นได้ดียิ่งขึ้น",

        price: 599,

        category: "beauty",

        rating: 4.9,

        shop: {
            name: "Dr.PONG",

            logo: "images/shops/Dr.Pong.jpeg",

            mall: true
        }
    },


    {
        id: 2,

        image: "images/products/product2.jpg",

        name: "สินค้าแนะนำ #2",

        description: "รายละเอียดสินค้าของคุณสามารถแก้ตรงนี้ได้",

        price: 1290,

        category: "fashion",

        rating: 4.8,

        shop: {
            name: "Fashion Store",

            logo: "images/shops/shop2.jpg",

            mall: true
        }
    },


    {
        id: 3,

        image: "images/products/product3.jpg",

        name: "สินค้าแนะนำ #3",

        description: "รายละเอียดสินค้าของคุณสามารถแก้ตรงนี้ได้",

        price: 350,

        category: "other",

        rating: 4.7,

        shop: {
            name: "ร้านค้าทั่วไป",

            logo: "images/shops/shop1.jpg",

            mall: false
        }
    }

];


/* =====================================================
   VARIABLES
===================================================== */

let cart = [];

let currentCategory = "all";


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts() {

    const grid =
        document.getElementById("product-grid");

    const keyword =
        document
        .getElementById("search-input")
        .value
        .trim()
        .toLowerCase();


    const filtered = products.filter(product => {

        const matchCategory =
            currentCategory === "all" ||
            product.category === currentCategory;


        const matchSearch =
            product.name.toLowerCase().includes(keyword) ||
            product.description.toLowerCase().includes(keyword) ||
            product.shop.name.toLowerCase().includes(keyword);


        return matchCategory && matchSearch;

    });


    document.getElementById("product-count").innerText =
        `${filtered.length} สินค้า`;


    if (filtered.length === 0) {

        grid.innerHTML = `

            <div
                class="col-span-full
                bg-white
                rounded-3xl
                border border-slate-200
                p-10
                text-center"
            >

                <i
                    class="fa-solid fa-box-open
                    text-4xl text-slate-300"
                ></i>

                <p class="font-bold text-slate-500 mt-3">
                    ไม่พบสินค้าที่ค้นหา
                </p>

            </div>

        `;

        return;
    }


    grid.innerHTML = filtered.map(product => `

        <div
            class="product-card
            bg-white
            rounded-3xl
            border border-slate-200
            overflow-hidden"
        >

            <!-- IMAGE -->

            <div
                class="h-56
                bg-slate-100
                overflow-hidden
                relative"
            >

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    class="product-image
                    w-full h-full
                    object-cover"
                    onerror="this.src='https://placehold.co/600x600/e2e8f0/64748b?text=No+Image'"
                >


                ${
                    product.shop.mall
                    ?
                    `
                    <span
                        class="absolute
                        top-3 left-3
                        bg-orange-500
                        text-white
                        px-2.5 py-1
                        rounded-lg
                        text-[10px]
                        font-black
                        shadow"
                    >

                        <i class="fa-solid fa-shield-check mr-1"></i>

                        MALL

                    </span>
                    `
                    :
                    ""
                }

            </div>


            <!-- CONTENT -->

            <div class="p-4">

                <h3
                    class="font-black
                    text-base
                    text-slate-800
                    line-clamp-1"
                >
                    ${product.name}
                </h3>


                <p
                    class="text-xs
                    text-slate-400
                    mt-1
                    h-8
                    line-clamp-2"
                >
                    ${product.description}
                </p>


                <!-- RATING -->

                <div
                    class="flex
                    items-center
                    gap-1
                    mt-3"
                >

                    <i
                        class="fa-solid fa-star
                        text-amber-400 text-xs"
                    ></i>

                    <span
                        class="text-xs
                        font-bold
                        text-slate-600"
                    >
                        ${product.rating}
                    </span>

                </div>


                <!-- SHOP -->

                <div
                    class="flex
                    items-center
                    gap-2
                    mt-3
                    pt-3
                    border-t
                    border-slate-100"
                >

                    <img
                        src="${product.shop.logo}"
                        class="w-8 h-8
                        rounded-lg
                        object-cover
                        border border-slate-200"
                        onerror="this.src='https://placehold.co/100x100/e2e8f0/64748b?text=Shop'"
                    >


                    <div class="min-w-0">

                        <p
                            class="text-xs
                            font-bold
                            truncate"
                        >
                            ${product.shop.name}
                        </p>


                        ${
                            product.shop.mall
                            ?
                            `
                            <p
                                class="text-[9px]
                                text-orange-500
                                font-bold"
                            >

                                <i class="fa-solid fa-circle-check"></i>

                                Mall

                            </p>
                            `
                            :
                            `
                            <p
                                class="text-[9px]
                                text-slate-400"
                            >
                                ร้านค้าทั่วไป
                            </p>
                            `
                        }

                    </div>

                </div>


                <!-- PRICE -->

                <div
                    class="flex
                    items-center
                    justify-between
                    mt-4"
                >

                    <div>

                        <p
                            class="text-[10px]
                            text-slate-400"
                        >
                            ราคา
                        </p>

                        <p
                            class="text-xl
                            font-black
                            text-indigo-600"
                        >
                            ฿${product.price.toLocaleString()}
                        </p>

                    </div>


                    <button
                        onclick="addToCart(${product.id})"
                        class="w-11 h-11
                        rounded-xl
                        bg-indigo-600
                        hover:bg-indigo-700
                        text-white
                        flex items-center
                        justify-center
                        transition
                        active:scale-95"
                        title="เพิ่มลงตะกร้า"
                    >

                        <i class="fa-solid fa-cart-plus"></i>

                    </button>

                </div>

            </div>

        </div>

    `).join("");

}


/* =====================================================
   CATEGORY
===================================================== */

function setCategory(category) {

    currentCategory = category;

    renderProducts();

}


/* =====================================================
   CART
===================================================== */

function addToCart(productId) {

    const product =
        products.find(p => p.id === productId);

    if (!product) return;


    const existing =
        cart.find(item => item.id === productId);


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            ...product,

            quantity: 1

        });

    }


    updateCart();

    openCart();

}


function removeFromCart(productId) {

    cart =
        cart.filter(item => item.id !== productId);

    updateCart();

}


function changeQuantity(productId, amount) {

    const item =
        cart.find(item => item.id === productId);

    if (!item) return;


    item.quantity += amount;


    if (item.quantity <= 0) {

        removeFromCart(productId);

        return;

    }


    updateCart();

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart() {

    const count =
        cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );


    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.quantity,
            0
        );


    const badge =
        document.getElementById("cart-count");


    badge.innerText = count;


    if (count > 0) {

        badge.classList.remove("hidden");

        badge.classList.add("cart-badge");

    } else {

        badge.classList.add("hidden");

    }


    document.getElementById("cart-summary").innerText =
        `${count} รายการ`;


    document.getElementById("cart-total").innerText =
        `฿${total.toLocaleString()}`;


    renderCart();

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart() {

    const container =
        document.getElementById("cart-items");


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="text-center py-10">

                <i
                    class="fa-solid fa-cart-shopping
                    text-4xl
                    text-slate-200"
                ></i>

                <p
                    class="text-sm
                    text-slate-400
                    mt-3"
                >
                    ยังไม่มีสินค้าในตะกร้า
                </p>

            </div>

        `;

        return;

    }


    container.innerHTML = cart.map(item => `

        <div
            class="flex gap-3
            p-3
            bg-slate-50
            rounded-2xl"
        >

            <img
                src="${item.image}"
                class="w-16 h-16
                rounded-xl
                object-cover"
            >


            <div class="flex-1 min-w-0">

                <p
                    class="font-bold
                    text-sm
                    truncate"
                >
                    ${item.name}
                </p>

                <p
                    class="text-xs
                    text-indigo-600
                    font-bold
                    mt-1"
                >
                    ฿${item.price.toLocaleString()}
                </p>


                <div
                    class="flex
                    items-center
                    gap-2
                    mt-2"
                >

                    <button
                        onclick="changeQuantity(${item.id}, -1)"
                        class="w-6 h-6
                        rounded-lg
                        bg-white
                        border
                        text-xs"
                    >
                        −
                    </button>


                    <span
                        class="text-xs
                        font-bold"
                    >
                        ${item.quantity}
                    </span>


                    <button
                        onclick="changeQuantity(${item.id}, 1)"
                        class="w-6 h-6
                        rounded-lg
                        bg-white
                        border
                        text-xs"
                    >
                        +
                    </button>

                </div>

            </div>


            <button
                onclick="removeFromCart(${item.id})"
                class="text-slate-300
                hover:text-rose-500"
            >

                <i class="fa-solid fa-trash"></i>

            </button>

        </div>

    `).join("");

}


/* =====================================================
   CART MODAL
===================================================== */

function openCart() {

    document
        .getElementById("cart-modal")
        .classList.remove("hidden");

}


function closeCart() {

    document
        .getElementById("cart-modal")
        .classList.add("hidden");

}

===================================================== */

function checkout() {

    if (cart.length === 0) {

        alert("กรุณาเพิ่มสินค้าลงตะกร้าก่อน");

        return;

    }


    alert(
        "ระบบ Checkout กำลังเตรียมเชื่อมต่อกับระบบชำระเงินครับ 🚀\n\n" +
        "ขั้นต่อไปเราสามารถเพิ่ม:\n" +
        "• QR Payment\n" +
        "• บัตรเครดิต/เดบิต\n" +
        "• เก็บเงินปลายทาง (COD)\n" +

/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        renderProducts();

        updateCart();

    }
);

</script>
