<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Risk Pro - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl space-y-6 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-2 shadow-lg">
            <i class="fa-solid fa-truck-fast text-2xl text-amber-400"></i>
        </div>
        <div>
            <h1 class="text-2xl font-black text-white">Delivery Risk Pro</h1>
            <p class="text-xs text-slate-400 mt-1">ระบบวิเคราะห์ความเสี่ยงและติดตามการส่งพัสดุ</p>
        </div>
        
        <div class="space-y-3 pt-2">
            <a href="driver.html" class="block w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-between">
                <span><i class="fa-solid fa-motorcycle mr-3"></i>สำหรับพนักงานส่งพัสดุ</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="admin.html" class="block w-full py-3.5 px-4 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-between">
                <span><i class="fa-solid fa-chart-pie mr-3"></i>ผู้บริหาร & แอดมิน</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="blacklist.html" class="block w-full py-3.5 px-4 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-between">
                <span><i class="fa-solid fa-user-shield mr-3"></i>จัดการแบล็กลิสต์</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="tracking.html" class="block w-full py-3.5 px-4 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl shadow-md transition-all text-sm flex items-center justify-between">
                <span><i class="fa-solid fa-magnifying-glass mr-3"></i>สำหรับลูกค้าติดตามพัสดุ</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </div>
</body>
</html>
