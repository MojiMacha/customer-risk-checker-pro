<script>

/* =====================================================
   STATE
===================================================== */

let selectedRole = "customer";


/* =====================================================
   DEMO USERS
===================================================== */

const DEMO_USERS = [

    {
        id: "customer-001",
        username: "customer",
        password: "1234",
        name: "ลูกค้าทดสอบ",
        role: "customer"
    },

    {
        id: "admin-001",
        username: "admin",
        password: "admin123",
        name: "ผู้ดูแลระบบ",
        role: "staff"
    }

];


/* =====================================================
   SELECT ROLE
===================================================== */

function selectRole(role) {

    selectedRole = role;


    const customerButton =
        document.getElementById("customer-role");


    const staffButton =
        document.getElementById("staff-role");


    customerButton.classList.remove(
        "active"
    );


    staffButton.classList.remove(
        "active"
    );


    if (role === "customer") {

        customerButton.classList.add(
            "active"
        );

    }

    else {

        staffButton.classList.add(
            "active"
        );

    }


    hideError();

}


/* =====================================================
   TOGGLE PASSWORD
===================================================== */

function togglePassword() {

    const input =
        document.getElementById("password");


    const icon =
        document.getElementById("password-icon");


    if (input.type === "password") {

        input.type = "text";

        icon.className =
            "fa-solid fa-eye-slash";

    }

    else {

        input.type = "password";

        icon.className =
            "fa-solid fa-eye";

    }

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message) {

    const box =
        document.getElementById("login-error");


    const text =
        document.getElementById("login-error-text");


    text.textContent =
        message;


    box.classList.remove("hidden");

}


/* =====================================================
   HIDE ERROR
===================================================== */

function hideError() {

    document
        .getElementById("login-error")
        .classList.add("hidden");

}


/* =====================================================
   GET USERS FROM LOCAL STORAGE
===================================================== */

function getUsers() {

    try {

        const saved =
            localStorage.getItem("users");


        if (!saved) {

            return DEMO_USERS;

        }


        const parsed =
            JSON.parse(saved);


        if (!Array.isArray(parsed)) {

            return DEMO_USERS;

        }


        return [
            ...DEMO_USERS,
            ...parsed
        ];

    }

    catch (error) {

        console.error(
            "ไม่สามารถอ่าน users:",
            error
        );

        return DEMO_USERS;

    }

}


/* =====================================================
   NORMALIZE ROLE
===================================================== */

function normalizeRole(role) {

    const value =
        String(role || "")
            .trim()
            .toLowerCase();


    if (
        value === "admin" ||
        value === "staff" ||
        value === "employee" ||
        value === "พนักงาน"
    ) {

        return "staff";

    }


    return "customer";

}


/* =====================================================
   LOGIN
===================================================== */

function login() {

    hideError();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if (!username) {

        showError(
            "กรุณากรอกชื่อผู้ใช้"
        );

        return;

    }


    if (!password) {

        showError(
            "กรุณากรอกรหัสผ่าน"
        );

        return;

    }


    const users =
        getUsers();


    const user =
        users.find(
            item => {

                const itemUsername =
                    String(
                        item.username ||
                        item.email ||
                        item.name ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                const inputUsername =
                    username.toLowerCase();


                return (
                    itemUsername ===
                    inputUsername
                );

            }
        );


    /*
       ถ้าไม่เจอ user
       ให้ลอง Demo Account
    */

    let matchedUser = null;


    if (user) {

        /*
           ถ้ามี password ในข้อมูล
           ให้ตรวจสอบ
        */

        if (
            user.password !== undefined &&
            String(user.password) !== password
        ) {

            showError(
                "รหัสผ่านไม่ถูกต้อง"
            );

            return;

        }


        matchedUser = user;

    }

    else {

        /*
           ตรวจ Demo
        */

        matchedUser =
            DEMO_USERS.find(
                item =>
                    item.username === username &&
                    item.password === password
            );

    }


    if (!matchedUser) {

        showError(
            "ไม่พบชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง"
        );

        return;

    }


    const userRole =
        normalizeRole(
            matchedUser.role
        );


    /*
       ตรวจ Role ที่เลือก
    */

    if (
        selectedRole !==
        userRole
    ) {

        if (userRole === "staff") {

            showError(
                "บัญชีนี้เป็นพนักงาน กรุณาเลือก \"พนักงาน\""
            );

        }

        else {

            showError(
                "บัญชีนี้เป็นลูกค้า กรุณาเลือก \"ลูกค้า\""
            );

        }

        return;

    }


    /*
       สร้าง Session
    */

    const session = {

        id:
            matchedUser.id ||
            username,

        username:
            matchedUser.username ||
            username,

        name:
            matchedUser.name ||
            username,

        role:
            userRole,

        loginAt:
            new Date().toISOString()

    };


    localStorage.setItem(
        "currentUser",
        JSON.stringify(session)
    );


    localStorage.setItem(
        "isLoggedIn",
        "true"
    );


    localStorage.setItem(
        "userRole",
        userRole
    );


    /*
       Redirect
    */

    const button =
        document.getElementById(
            "login-button"
        );


    button.disabled = true;


    button.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-2"></i>
        กำลังเข้าสู่ระบบ...
    `;


    setTimeout(
        function() {

            if (userRole === "staff") {

                window.location.href =
                    "admin.html";

            }

            else {

                window.location.href =
                    "shop.html";

            }

        },
        400
    );

}


/* =====================================================
   ENTER KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);


/* =====================================================
   CHECK EXISTING LOGIN
===================================================== */

function checkExistingLogin() {

    try {

        const isLoggedIn =
            localStorage.getItem(
                "isLoggedIn"
            );


        const currentUser =
            localStorage.getItem(
                "currentUser"
            );


        if (
            isLoggedIn === "true" &&
            currentUser
        ) {

            const user =
                JSON.parse(
                    currentUser
                );


            /*
               ถ้า Login อยู่แล้ว
               ให้ไปหน้าตาม Role
            */

            if (
                user.role === "staff" ||
                user.role === "admin"
            ) {

                window.location.href =
                    "admin.html";

            }

            else {

                window.location.href =
                    "shop.html";

            }

        }

    }

    catch (error) {

        console.error(
            "Session error:",
            error
        );

    }

}


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        checkExistingLogin();

    }
);

</script>
